<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Camprover Level</title>

<style>

:root{
  --bg:#070b0f;
  --panel:#0d1319;
  --panel-border:#202b33;
  --text:#f4f7f9;
  --muted:#7d8992;

  /* MAVİ TONU BURADAN DEĞİŞTİREBİLİRSİN */
  --level-blue:#00A8FF;

  --green:#25e87a;
}

/* =========================
   GENEL
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  position:relative;
}

/* =========================
   CAMPROVER
========================= */

.brand{
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);

  font-size:19px;
  font-weight:700;
  letter-spacing:4px;

  color:#f1f5f7;

  z-index:20;
  white-space:nowrap;
}

/* =========================
   GPS BİLGİ KUTUSU
========================= */

.gpsInfo{
  position:absolute;

  top:38px;
  left:50%;
  transform:translateX(-50%);

  width:min(420px,72vw);

  display:flex;
  justify-content:space-around;
  align-items:center;

  padding:8px 18px;

  border:2px solid rgba(0,168,255,.35);
  border-radius:12px;

  background:rgba(8,12,16,.88);

  box-shadow:
    0 0 14px rgba(0,168,255,.08);

  z-index:20;
}

.gpsItem{
  display:flex;
  flex-direction:column;
  align-items:center;

  min-width:120px;
}

.gpsLabel{
  font-size:12px;
  font-weight:600;
  letter-spacing:1.5px;

  color:#8e9aa3;
}

.gpsValue{
  font-size:26px;
  font-weight:700;
  line-height:1.1;

  letter-spacing:.5px;

  color:#f5f8fa;

  white-space:nowrap;
}

/* =========================
   ANA DASHBOARD
========================= */

.dashboard{
  width:100%;
  height:100%;

  display:grid;
  grid-template-columns:1fr 1.05fr 1fr;
  gap:18px;

  align-items:center;

  padding:85px 25px 25px;
}

/* =========================
   PANELLER
========================= */

.panel{
  position:relative;

  height:calc(100vh - 110px);

  min-height:430px;

  background:
    linear-gradient(
      145deg,
      rgba(17,24,31,.96),
      rgba(8,12,16,.96)
    );

  border:4px solid var(--panel-border);

  border-radius:22px;

  display:flex;
  flex-direction:column;
  align-items:center;

  overflow:hidden;

  transition:
    border-color .25s ease,
    box-shadow .25s ease;
}

/* =========================
   PANEL BAŞLIKLARI
========================= */

.panelTitle{
  margin-top:24px;

  font-size:14px;
  font-weight:700;

  letter-spacing:2px;

  color:#9aa5ad;

  text-align:center;
}

/* =========================
   DERECE DEĞERİ
========================= */

.value{
  margin-top:8px;

  font-size:58px;
  line-height:1;

  font-weight:700;

  letter-spacing:-2px;

  color:#f5f7f8;
}

.unit{
  font-size:.45em;
  margin-left:3px;
  vertical-align:top;
  position:relative;
  top:5px;
}

/* =========================
   ARAÇ GÖRSELİ
========================= */

.vehicleWrap{
  width:100%;
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:0;

  padding:15px 25px 25px;
}

.vehicle{
  width:90%;
  max-width:480px;

  max-height:75%;

  object-fit:contain;

  display:block;

  transform-origin:center center;

  transition:none;

  will-change:transform;
}

/* =========================
   MERKEZ PANEL
========================= */

.centerPanel{
  justify-content:center;
}

/* =========================
   YEŞİL DAİRESEL SEVİYE
========================= */

.level{
  position:relative;

  width:min(420px,34vw);
  height:min(420px,34vw);

  max-width:90%;
  max-height:75%;

  aspect-ratio:1 / 1;

  border-radius:50%;

  background:
    radial-gradient(
      circle at center,
      #18251f 0%,
      #101914 58%,
      #0b100d 100%
    );

  border:3px solid rgba(37,232,122,.28);

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.75),
    0 0 20px rgba(37,232,122,.05);

  overflow:hidden;
}

.liquid{
  position:absolute;

  inset:0;

  border-radius:50%;
}

/* =========================
   EKSENLER
========================= */

.axis{
  position:absolute;

  background:rgba(37,232,122,.22);

  pointer-events:none;
}

.axis.horizontal{
  left:7%;
  right:7%;
  top:50%;

  height:1px;

  transform:translateY(-50%);
}

.axis.vertical{
  top:7%;
  bottom:7%;
  left:50%;

  width:1px;

  transform:translateX(-50%);
}

/* =========================
   DERECE İŞARETLERİ
========================= */

.tick{
  position:absolute;

  background:rgba(37,232,122,.28);

  border-radius:2px;
}

.tick.horizontal{
  width:1px;
  height:9px;
  top:50%;
}

.tick.vertical{
  width:9px;
  height:1px;
  left:50%;
}

.x1{
  left:38%;
  transform:translate(-50%,-50%);
}

.x2{
  left:44%;
  transform:translate(-50%,-50%);
}

.x3{
  left:56%;
  transform:translate(-50%,-50%);
}

.x4{
  left:62%;
  transform:translate(-50%,-50%);
}

.y1{
  top:38%;
  transform:translate(-50%,-50%);
}

.y2{
  top:44%;
  transform:translate(-50%,-50%);
}

.y3{
  top:56%;
  transform:translate(-50%,-50%);
}

.y4{
  top:62%;
  transform:translate(-50%,-50%);
}

/* =========================
   DAİRE İÇİ DERECELER
========================= */

.levelLabel{
  position:absolute;

  color:rgba(190,230,207,.48);

  font-size:11px;
  font-weight:600;

  pointer-events:none;
}

.labelTop{
  top:10%;
  left:50%;
  transform:translateX(-50%);
}

.labelBottom{
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
}

.labelLeft{
  left:9%;
  top:50%;
  transform:translateY(-50%);
}

.labelRight{
  right:9%;
  top:50%;
  transform:translateY(-50%);
}

/* =========================
   MERKEZ NOKTASI
========================= */

.center-dot{
  position:absolute;

  left:50%;
  top:50%;

  width:7px;
  height:7px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#d5ffe4;

  box-shadow:
    0 0 8px rgba(37,232,122,.7);

  z-index:5;
}

/* =========================
   YEŞİL BALON
========================= */

.bubble{
  position:absolute;

  left:50%;
  top:50%;

  width:42px;
  height:42px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #d8ffe7 0%,
      #6aff9d 18%,
      #25e87a 45%,
      #12a84e 75%,
      #087036 100%
    );

  border:2px solid rgba(220,255,232,.75);

  box-shadow:
    0 0 15px rgba(37,232,122,.55),
    inset 0 0 9px rgba(255,255,255,.28);

  z-index:4;

  will-change:transform;
}

/* =========================
   MOBİL
========================= */

@media (max-width:700px){

  .brand{
    top:5px;

    font-size:17px;
    letter-spacing:3.5px;
  }

  /* GPS kutusu */

  .gpsInfo{
    top:29px;

    width:min(88vw,430px);

    padding:7px 12px;

    border-radius:11px;
  }

  .gpsItem{
    min-width:110px;
  }

  .gpsLabel{
    font-size:11px;
    letter-spacing:1.3px;
  }

  .gpsValue{
    font-size:25px;
  }

  /* Dashboard */

  .dashboard{
    height:100%;

    display:grid;

    grid-template-columns:1fr 1fr;
    grid-template-rows:
      minmax(0,1fr)
      minmax(150px,.43fr);

    gap:10px;

    padding:
      105px
      10px
      10px;
  }

  /* Merkez */

  .centerPanel{
    grid-column:1 / 3;
    grid-row:1;

    border-width:3px;

    border-radius:18px;

    min-height:0;

    justify-content:center;
  }

  /* Yeşil daireyi küçült */

  .level{
    width:min(58vw,290px);
    height:min(58vw,290px);

    max-width:64%;
    max-height:70%;
  }

  .bubble{
    width:34px;
    height:34px;
  }

  .levelLabel{
    font-size:9px;
  }

  /* Alt paneller */

  .pitchPanel{
    grid-column:1;
    grid-row:2;
  }

  .rollPanel{
    grid-column:2;
    grid-row:2;
  }

  .panel{
    width:100%;
    height:100%;

    min-height:0;

    border-width:3px;

    border-radius:16px;
  }

  .panelTitle{
    margin-top:9px;

    font-size:10px;

    letter-spacing:1px;

    white-space:nowrap;
  }

  .value{
    margin-top:5px;

    font-size:32px;
  }

  .vehicleWrap{
    padding:3px 8px 8px;
  }

  .vehicle{
    width:95%;
    max-height:80%;
  }
}

/* =========================
   KISA TELEFONLAR
========================= */

@media (max-width:700px) and (max-height:700px){

  .dashboard{
    padding-top:100px;
  }

  .level{
    width:min(54vw,270px);
    height:min(54vw,270px);

    max-width:60%;
    max-height:67%;
  }

  .gpsInfo{
    top:27px;
  }

  .gpsValue{
    font-size:23px;
  }

  .panelTitle{
    font-size:9px;
  }

  .value{
    font-size:29px;
  }
}

/* =========================
   SENSOR BAŞLANGIÇ EKRANI
========================= */

#startScreen{
  position:fixed;

  inset:0;

  z-index:999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#070b0f;
}

.startBox{
  width:min(90vw,400px);

  text-align:center;
}

.startTitle{
  font-size:28px;

  font-weight:700;

  letter-spacing:4px;

  margin-bottom:12px;
}

.startText{
  color:#7d8992;

  font-size:14px;

  line-height:1.5;

  margin-bottom:28px;
}

#startButton{
  border:1px solid rgba(0,168,255,.6);

  background:rgba(0,168,255,.12);

  color:#fff;

  border-radius:14px;

  padding:15px 28px;

  font-size:15px;

  font-weight:700;

  letter-spacing:1px;
}

#startButton:active{
  transform:scale(.97);
}

/* =========================
   MAVİ DENGE ÇERÇEVESİ
========================= */

.level-blue-0{
  border-color:var(--panel-border);
  box-shadow:none;
}

</style>
</head>

<body>

<!-- =========================
     BAŞLANGIÇ
========================= -->

<div id="startScreen">

  <div class="startBox">

    <div class="startTitle">
      CAMPROVER
    </div>

    <div class="startText">
      Telefonu araç tutucusuna yerleştirin ve ölçümü başlatın.
    </div>

    <button id="startButton">
      ÖLÇÜMÜ BAŞLAT
    </button>

  </div>

</div>


<!-- =========================
     ÜST BİLGİ
========================= -->

<div class="brand">
  CAMPROVER
</div>


<!-- =========================
     GPS
========================= -->

<div class="gpsInfo">

  <div class="gpsItem">

    <span class="gpsLabel">
      RAKIM
    </span>

    <span
      class="gpsValue"
      id="altitudeValue">
      -- m
    </span>

  </div>


  <div class="gpsItem">

    <span class="gpsLabel">
      HIZ
    </span>

    <span
      class="gpsValue"
      id="speedValue">
      -- km/h
    </span>

  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard">


  <!-- =====================
       PITCH
  ====================== -->

  <section
    class="panel pitchPanel"
    id="pitchPanel">

    <div class="panelTitle">
      ÖN - ARKA DENGE
    </div>

    <div
      class="value"
      id="pitchValue">
      +0<span class="unit">°</span>
    </div>

    <div class="vehicleWrap">

      <img
        id="pitchImage"
        class="vehicle"
        alt="Discovery pitch">

    </div>

  </section>


  <!-- =====================
       MERKEZ
  ====================== -->

  <section
    class="panel centerPanel"
    id="centerPanel">

    <div class="level">

      <div class="liquid">

        <div class="axis horizontal"></div>
        <div class="axis vertical"></div>

        <div class="tick horizontal x1"></div>
        <div class="tick horizontal x2"></div>
        <div class="tick horizontal x3"></div>
        <div class="tick horizontal x4"></div>

        <div class="tick vertical y1"></div>
        <div class="tick vertical y2"></div>
        <div class="tick vertical y3"></div>
        <div class="tick vertical y4"></div>

        <div class="levelLabel labelTop">
          +10°
        </div>

        <div class="levelLabel labelBottom">
          -10°
        </div>

        <div class="levelLabel labelLeft">
          -10°
        </div>

        <div class="levelLabel labelRight">
          +10°
        </div>

        <div class="center-dot"></div>

        <div
          class="bubble"
          id="bubble">
        </div>

      </div>

    </div>

  </section>


  <!-- =====================
       ROLL
  ====================== -->

  <section
    class="panel rollPanel"
    id="rollPanel">

    <div class="panelTitle">
      SAĞ - SOL DENGE
    </div>

    <div
      class="value"
      id="rollValue">
      +0<span class="unit">°</span>
    </div>

    <div class="vehicleWrap">

      <img
        id="rollImage"
        class="vehicle"
        alt="Discovery roll">

    </div>

  </section>

</div>


<script>

(async function(){

  /* =========================================
     CACHE TEMİZLE
  ========================================= */

  try{

    if("serviceWorker" in navigator){

      const registrations =
        await navigator.serviceWorker.getRegistrations();

      for(const registration of registrations){

        await registration.unregister();

      }

    }

  }catch(e){

    console.log("Service Worker temizleme:",e);

  }


  try{

    if("caches" in window){

      const keys =
        await caches.keys();

      for(const key of keys){

        await caches.delete(key);

      }

    }

  }catch(e){

    console.log("Cache temizleme:",e);

  }


  /* =========================================
     GÖRSELLER
  ========================================= */

  const IMAGE_VERSION =
    "20261008-18";

  const pitchImage =
    document.getElementById("pitchImage");

  const rollImage =
    document.getElementById("rollImage");

  pitchImage.src =
    "pitch_discovery.png?v=" +
    IMAGE_VERSION;

  rollImage.src =
    "roll_discovery.png?v=" +
    IMAGE_VERSION;


  /* =========================================
     DOM
  ========================================= */

  const pitchValue =
    document.getElementById("pitchValue");

  const rollValue =
    document.getElementById("rollValue");

  const pitchPanel =
    document.getElementById("pitchPanel");

  const rollPanel =
    document.getElementById("rollPanel");

  const bubble =
    document.getElementById("bubble");

  const altitudeValue =
    document.getElementById("altitudeValue");

  const speedValue =
    document.getElementById("speedValue");

  const startScreen =
    document.getElementById("startScreen");

  const startButton =
    document.getElementById("startButton");


  /* =========================================
     FİLTRELER
  ========================================= */

  const SENSOR_ALPHA = 0.08;

  const BUBBLE_ALPHA = 0.08;

  const VEHICLE_ALPHA = 0.20;

  const DEAD_BAND = 0.15;

  const MAX_ANGLE = 10;

  const ALTITUDE_ALPHA = 0.08;

  const SPEED_ALPHA = 0.12;


  /* =========================================
     SENSOR DEĞİŞKENLERİ
  ========================================= */

  let filteredAx = 0;
  let filteredAy = 0;
  let filteredAz = 0;

  let sensorInitialized = false;

  let pitchFiltered = 0;
  let rollFiltered = 0;

  let bubblePitch = 0;
  let bubbleRoll = 0;

  let vehiclePitch = 0;
  let vehicleRoll = 0;


  /* =========================================
     GPS DEĞİŞKENLERİ
  ========================================= */

  let altitudeFiltered = null;

  let speedFiltered = 0;

  let gpsStarted = false;


  /* =========================================
     YARDIMCI
  ========================================= */

  function clamp(value,min,max){

    return Math.max(
      min,
      Math.min(max,value)
    );

  }


  function stabilize(value){

    if(
      Math.abs(value) <
      DEAD_BAND
    ){

      return 0;

    }

    return value;

  }


  function formatAngle(value){

    let rounded =
      Math.round(value);

    rounded =
      clamp(
        rounded,
        -MAX_ANGLE,
        MAX_ANGLE
      );

    if(
      rounded === 0
    ){

      return "+0";

    }

    return rounded > 0
      ? "+" + rounded
      : String(rounded);

  }


  /* =========================================
     MAVİ ÇERÇEVE
  ========================================= */

  function updateBorder(
    panel,
    value
  ){

    const abs =
      Math.abs(value);

    let strength = 0;

    if(abs <= 5){

      strength =
        (5 - abs) / 5;

    }

    if(strength <= 0){

      panel.style.borderColor =
        "var(--panel-border)";

      panel.style.boxShadow =
        "none";

      return;

    }


    const alpha =
      0.18 +
      strength * 0.82;


    panel.style.borderColor =
      `rgba(0,168,255,${alpha})`;


    panel.style.boxShadow =
      `0 0 ${8 + strength * 20}px rgba(0,168,255,${strength * .28})`;

  }


  /* =========================================
     SEVİYE GÜNCELLE
  ========================================= */

  function updateLevel(){

    pitchFiltered =
      clamp(
        stabilize(pitchFiltered),
        -MAX_ANGLE,
        MAX_ANGLE
      );

    rollFiltered =
      clamp(
        stabilize(rollFiltered),
        -MAX_ANGLE,
        MAX_ANGLE
      );


    /* DEĞERLER */

    pitchValue.innerHTML =
      formatAngle(pitchFiltered) +
      '<span class="unit">°</span>';

    rollValue.innerHTML =
      formatAngle(rollFiltered) +
      '<span class="unit">°</span>';


    /* MAVİ ÇERÇEVE */

    updateBorder(
      pitchPanel,
      pitchFiltered
    );

    updateBorder(
      rollPanel,
      rollFiltered
    );


    /* =====================================
       MERKEZ BALON
    ===================================== */

    bubblePitch +=
      (
        pitchFiltered -
        bubblePitch
      ) * BUBBLE_ALPHA;

    bubbleRoll +=
      (
        rollFiltered -
        bubbleRoll
      ) * BUBBLE_ALPHA;


    const level =
      bubble.parentElement;

    const maxX =
      level.clientWidth * 0.38;

    const maxY =
      level.clientHeight * 0.38;


    const x =
      (bubbleRoll / MAX_ANGLE) *
      maxX;

    const y =
      (bubblePitch / MAX_ANGLE) *
      maxY;


    bubble.style.transform =
      `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;


    /* =====================================
       ARAÇ GÖRSELLERİ
    ===================================== */

    vehiclePitch +=
      (
        pitchFiltered -
        vehiclePitch
      ) * VEHICLE_ALPHA;

    vehicleRoll +=
      (
        rollFiltered -
        vehicleRoll
      ) * VEHICLE_ALPHA;


    vehiclePitch =
      clamp(
        vehiclePitch,
        -MAX_ANGLE,
        MAX_ANGLE
      );

    vehicleRoll =
      clamp(
        vehicleRoll,
        -MAX_ANGLE,
        MAX_ANGLE
      );


    pitchImage.style.transform =
      `rotate(${vehiclePitch}deg)`;


    rollImage.style.transform =
      `rotate(${vehicleRoll}deg)`;

  }


  /* =========================================
     TELEFON HAREKETİ
  ========================================= */

  function handleMotion(event){

    const acceleration =
      event.accelerationIncludingGravity;

    if(!acceleration){

      return;

    }


    let ax =
      acceleration.x || 0;

    let ay =
      acceleration.y || 0;

    let az =
      acceleration.z || 0;


    /* İlk sensör değerini referans olarak
       kullanmıyoruz.
       Sadece filtre başlangıcı. */

    if(!sensorInitialized){

      filteredAx = ax;
      filteredAy = ay;
      filteredAz = az;

      sensorInitialized = true;

    }else{

      filteredAx +=
        (
          ax -
          filteredAx
        ) * SENSOR_ALPHA;

      filteredAy +=
        (
          ay -
          filteredAy
        ) * SENSOR_ALPHA;

      filteredAz +=
        (
          az -
          filteredAz
        ) * SENSOR_ALPHA;

    }


    /* =====================================
       PITCH
    ===================================== */

    const newPitch =
      Math.atan2(
        filteredAz,
        Math.sqrt(
          filteredAx *
          filteredAx +
          filteredAy *
          filteredAy
        )
      ) *
      180 /
      Math.PI;


    /* =====================================
       ROLL
    ===================================== */

    const newRoll =
      Math.atan2(
        filteredAx,
        Math.sqrt(
          filteredAy *
          filteredAy +
          filteredAz *
          filteredAz
        )
      ) *
      180 /
      Math.PI;


    /* =====================================
       YAVAŞ FİLTRE
    ===================================== */

    pitchFiltered +=
      (
        newPitch -
        pitchFiltered
      ) * SENSOR_ALPHA;


    rollFiltered +=
      (
        newRoll -
        rollFiltered
      ) * SENSOR_ALPHA;


    updateLevel();

  }


  /* =========================================
     GPS
  ========================================= */

  function startGPS(){

    if(gpsStarted){

      return;

    }

    gpsStarted = true;


    if(!("geolocation" in navigator)){

      altitudeValue.textContent =
        "-- m";

      speedValue.textContent =
        "-- km/h";

      return;

    }


    navigator.geolocation.watchPosition(

      function(position){

        const coords =
          position.coords;


        /* ==============================
           RAKIM
        ============================== */

        if(
          coords.altitude !== null &&
          Number.isFinite(
            coords.altitude
          )
        ){

          const altitude =
            coords.altitude;


          if(
            altitudeFiltered === null
          ){

            altitudeFiltered =
              altitude;

          }else{

            altitudeFiltered +=
              (
                altitude -
                altitudeFiltered
              ) *
              ALTITUDE_ALPHA;

          }


          altitudeValue.textContent =
            Math.round(
              altitudeFiltered
            ) +
            " m";

        }


        /* ==============================
           HIZ
        ============================== */

        if(
          coords.speed !== null &&
          Number.isFinite(
            coords.speed
          )
        ){

          let speedKmh =
            coords.speed * 3.6;


          if(speedKmh < 1){

            speedKmh = 0;

          }


          speedFiltered +=
            (
              speedKmh -
              speedFiltered
            ) *
            SPEED_ALPHA;


          if(
            speedFiltered < 1
          ){

            speedFiltered = 0;

          }


          speedValue.textContent =
            Math.round(
              speedFiltered
            ) +
            " km/h";

        }

      },

      function(error){

        console.log(
          "GPS hatası:",
          error
        );

      },

      {
        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

  }


  /* =========================================
     SENSOR BAŞLAT
  ========================================= */

  async function startSensor(){

    try{

      /*
       * iOS DeviceMotion izni
       */

      if(
        typeof DeviceMotionEvent !==
        "undefined" &&
        typeof DeviceMotionEvent.requestPermission ===
        "function"
      ){

        const permission =
          await DeviceMotionEvent.requestPermission();


        if(permission !== "granted"){

          alert(
            "Hareket sensörü izni verilmedi."
          );

          return;

        }

      }


      /*
       * DeviceMotion
       */

      window.addEventListener(
        "devicemotion",
        handleMotion,
        true
      );


      /*
       * GPS
       */

      startGPS();


      /*
       * Başlangıç ekranını kapat
       */

      startScreen.style.display =
        "none";


    }catch(error){

      console.error(
        "Sensör başlatma hatası:",
        error
      );

      alert(
        "Sensör başlatılamadı."
      );

    }

  }


  /* =========================================
     BAŞLAT BUTONU
  ========================================= */

  startButton.addEventListener(
    "click",
    startSensor
  );


  /* =========================================
     BAŞLANGIÇ
  ========================================= */

  updateLevel();


})();

</script>
