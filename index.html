<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#080c10">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Camprover Level</title>

<style>

:root{
  --bg:#080c10;
  --panel:#10161c;
  --panel2:#0c1217;

  --text:#f1f5f8;
  --muted:#7f8b96;

  --border:#27313a;

  /* MAVİ RENGİ BURADAN DEĞİŞTİREBİLİRSİN */
  --level-blue:#00A8FF;

  --green:#35e27a;
  --green-dark:#173c27;

  --red:#ff4d5f;
}

/* -------------------- GENEL -------------------- */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  min-height:100%;

  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;

  overflow-x:hidden;
}

body{
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* -------------------- ANA KONTEYNER -------------------- */

.app{
  width:100%;
  max-width:1450px;

  min-height:100vh;

  padding:28px;

  display:flex;
  flex-direction:column;
}

/* -------------------- BAŞLIK -------------------- */

.header{
  text-align:center;
  margin-bottom:22px;
}

.header h1{
  margin:0;

  font-size:24px;
  font-weight:700;

  letter-spacing:3px;
}

.header p{
  margin:6px 0 0;

  color:var(--muted);

  font-size:12px;
  letter-spacing:1.5px;
}

/* -------------------- ANA GRID -------------------- */

.dashboard{
  flex:1;

  display:grid;

  grid-template-columns:
    minmax(230px,1fr)
    minmax(420px,1.5fr)
    minmax(230px,1fr);

  gap:20px;

  align-items:stretch;
}

/* -------------------- KART -------------------- */

.card{
  position:relative;

  min-height:520px;

  padding:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.005)
    ),
    var(--panel);

  border:4px solid var(--border);

  border-radius:24px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  transition:
    border-color .25s ease,
    box-shadow .25s ease;
}

.card-title{
  text-align:center;

  color:var(--muted);

  font-size:13px;
  font-weight:700;

  letter-spacing:3px;

  margin-top:3px;
}

.value{
  text-align:center;

  font-size:52px;
  font-weight:700;

  line-height:1;

  margin-top:18px;

  font-variant-numeric:tabular-nums;
}

/* -------------------- ARAÇ GÖRSELLERİ -------------------- */

.vehicle-area{
  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  position:relative;

  margin-top:15px;
}

.vehicle-area img{
  display:block;

  width:88%;
  max-width:330px;

  height:auto;

  object-fit:contain;

  transition:
    transform .18s ease-out;

  user-select:none;
  -webkit-user-drag:none;
}

/* -------------------- MERKEZ TERAZİ -------------------- */

.center-panel{
  position:relative;

  min-height:520px;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.035),
      transparent 65%
    );
}

/* -------------------- YEŞİL TERAZİ -------------------- */

.level{
  position:relative;

  width:min(440px,80vw);
  height:min(440px,80vw);

  border-radius:50%;

  border:2px solid #1c2930;

  background:
    radial-gradient(
      circle,
      rgba(53,226,122,.045),
      rgba(0,0,0,.05) 55%,
      rgba(0,0,0,.22)
    );

  box-shadow:
    inset 0 0 40px rgba(0,0,0,.5),
    0 0 50px rgba(0,0,0,.25);

  overflow:hidden;
}

/* -------------------- TERAZİ ÇİZGİLERİ -------------------- */

.level::before{
  content:"";

  position:absolute;

  left:50%;
  top:0;

  width:1px;
  height:100%;

  background:rgba(255,255,255,.12);

  transform:translateX(-50%);
}

.level::after{
  content:"";

  position:absolute;

  top:50%;
  left:0;

  width:100%;
  height:1px;

  background:rgba(255,255,255,.12);

  transform:translateY(-50%);
}

.line{
  position:absolute;

  background:rgba(255,255,255,.08);

  pointer-events:none;
}

.line.vertical{
  width:1px;
  height:100%;

  left:50%;
  top:0;
}

.line.horizontal{
  height:1px;
  width:100%;

  top:50%;
  left:0;
}

/* -------------------- DERECE TİKLERİ -------------------- */

.tick{
  position:absolute;

  width:2px;
  height:12px;

  background:rgba(255,255,255,.18);

  left:50%;
  top:8px;

  transform-origin:
    1px calc(50% + 212px);
}

.tick.t1{
  transform:rotate(10deg);
}

.tick.t2{
  transform:rotate(-10deg);
}

/* -------------------- YEŞİL BALON -------------------- */

.bubble{
  position:absolute;

  width:54px;
  height:54px;

  border-radius:50%;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle at 35% 30%,
      #8affb1 0%,
      #35e27a 35%,
      #19a954 70%,
      #087338 100%
    );

  border:2px solid rgba(255,255,255,.45);

  box-shadow:
    0 0 16px rgba(53,226,122,.55),
    inset 0 3px 8px rgba(255,255,255,.35);

  z-index:5;

  transition:
    left .08s linear,
    top .08s linear;
}

/* -------------------- MERKEZ ARAÇ -------------------- */

.center-car{
  position:absolute;

  left:50%;
  top:50%;

  width:54%;

  transform:
    translate(-50%,-50%);

  z-index:2;

  pointer-events:none;

  user-select:none;
  -webkit-user-drag:none;

  opacity:.92;
}

/* Balon aracın üzerinde olsun */
.bubble{
  z-index:6;
}

/* -------------------- MERKEZ ROZET -------------------- */

.level-badge{
  position:absolute;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  padding:6px 12px;

  border-radius:20px;

  background:rgba(8,12,16,.78);

  border:1px solid rgba(255,255,255,.08);

  color:#8e9aa5;

  font-size:10px;
  letter-spacing:2px;

  z-index:10;
}

/* -------------------- SIFIRLAMA BUTONU -------------------- */

.zero-button{
  position:absolute;

  left:-58px;
  top:50%;

  transform:translateY(-50%);

  width:46px;
  height:46px;

  border-radius:50%;

  border:2px solid var(--border);

  background:#111820;

  color:#aeb9c2;

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  outline:none;

  z-index:30;

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    color .25s ease,
    background .25s ease,
    transform .15s ease;
}

.zero-button:active{
  transform:
    translateY(-50%)
    scale(.92);
}

.zero-button.active{
  border-color:var(--level-blue);

  color:#ffffff;

  background:#0c1720;

  box-shadow:
    0 0 7px var(--level-blue),
    0 0 17px rgba(0,168,255,.55),
    0 0 30px rgba(0,168,255,.28);
}

/* -------------------- ALT BİLGİ -------------------- */

.footer{
  text-align:center;

  color:#52606b;

  font-size:10px;

  letter-spacing:1.5px;

  margin-top:18px;
}

/* -------------------- BAŞLAT EKRANI -------------------- */

.start-screen{
  position:fixed;

  inset:0;

  background:
    radial-gradient(
      circle at center,
      #111a21,
      #05080b 70%
    );

  display:flex;

  justify-content:center;
  align-items:center;

  z-index:1000;

  padding:25px;

  transition:
    opacity .3s ease,
    visibility .3s ease;
}

.start-screen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.start-box{
  width:min(420px,100%);

  padding:38px 30px;

  border-radius:28px;

  background:#0e151b;

  border:2px solid #202b33;

  text-align:center;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55);
}

.start-box h2{
  margin:0;

  font-size:24px;

  letter-spacing:3px;
}

.start-box p{
  color:#84909a;

  font-size:13px;

  line-height:1.6;

  margin:18px 0 28px;
}

.start-button{
  width:100%;

  border:0;

  border-radius:15px;

  padding:16px;

  background:var(--level-blue);

  color:white;

  font-size:14px;
  font-weight:700;

  letter-spacing:1.5px;

  cursor:pointer;

  box-shadow:
    0 0 25px rgba(0,168,255,.25);
}

/* -------------------- MOBİL -------------------- */

@media(max-width:900px){

  body{
    align-items:flex-start;
  }

  .app{
    padding:15px;
  }

  .header{
    margin-bottom:12px;
  }

  .header h1{
    font-size:19px;
  }

  .dashboard{
    grid-template-columns:1fr;

    gap:12px;
  }

  .center-panel{
    order:1;

    min-height:390px;
  }

  .card:first-child{
    order:2;
  }

  .card:last-child{
    order:3;
  }

  .card{
    min-height:330px;

    border-radius:20px;

    padding:15px;
  }

  .center-panel .level{
    width:min(360px,82vw);
    height:min(360px,82vw);
  }

  .center-car{
    width:52%;
  }

  .zero-button{
    left:-48px;

    width:42px;
    height:42px;
  }

  .value{
    font-size:43px;
  }

  .vehicle-area img{
    width:75%;
  }
}

/* Çok dar ekran */
@media(max-width:430px){

  .center-panel{
    min-height:350px;
  }

  .center-panel .level{
    width:300px;
    height:300px;
  }

  .zero-button{
    left:-43px;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- BAŞLIK -->
  <div class="header">

    <h1>CAMPROVER LEVEL</h1>

    <p>
      LAND ROVER DISCOVERY 2
    </p>

  </div>


  <!-- ANA PANEL -->
  <div class="dashboard">


    <!-- ==================== PITCH ==================== -->

    <div class="card" id="pitchCard">

      <div class="card-title">
        PITCH
      </div>

      <div class="value" id="pitch">
        0°
      </div>

      <div class="vehicle-area">

        <img
          id="pitchImg"
          src="pitch_discovery.png"
          alt="Discovery Pitch"
        >

      </div>

    </div>


    <!-- ==================== MERKEZ TERAZİ ==================== -->

    <div class="center-panel">

      <!-- SIFIRLAMA BUTONU -->

      <button
        id="zeroButton"
        class="zero-button"
        aria-label="Ölçümü sıfırla"
        title="Sıfırla"
      >
        0
      </button>


      <!-- YEŞİL TERAZİ -->

      <div class="level" id="level">

        <div class="line vertical"></div>

        <div class="line horizontal"></div>


        <!-- DERECE TİKLERİ -->

        <div class="tick t1"></div>
        <div class="tick t2"></div>


        <!-- MERKEZ ARAÇ -->

        <img
          id="centerCar"
          class="center-car"
          src="center_discovery.png"
          alt="Discovery"
        >


        <!-- YEŞİL BALON -->

        <div
          id="bubble"
          class="bubble"
        ></div>


        <div class="level-badge">
          GRAVITY LEVEL
        </div>

      </div>

    </div>


    <!-- ==================== ROLL ==================== -->

    <div class="card" id="rollCard">

      <div class="card-title">
        ROLL
      </div>

      <div class="value" id="roll">
        0°
      </div>

      <div class="vehicle-area">

        <img
          id="rollImg"
          src="roll_discovery.png"
          alt="Discovery Roll"
        >

      </div>

    </div>

  </div>


  <div class="footer">
    CAMPROVER LEVEL • GRAVITY BASED MEASUREMENT
  </div>

</div>


<!-- ==================== BAŞLAT EKRANI ==================== -->

<div
  id="start"
  class="start-screen"
>

  <div class="start-box">

    <h2>
      CAMPROVER LEVEL
    </h2>

    <p>
      Telefonun hareket sensörünü kullanarak
      aracın Pitch ve Roll değerlerini ölçer.
      <br><br>
      Ölçümü başlatmak için aşağıdaki butona bas.
    </p>

    <button
      id="startButton"
      class="start-button"
    >
      ÖLÇÜMÜ BAŞLAT
    </button>

  </div>

</div>


<script>

/* =========================================================
   CAMPROVER LEVEL
   ========================================================= */


/* -------------------------------
   ESKİ SERVICE WORKER / CACHE TEMİZLİĞİ
-------------------------------- */

(async function(){

  try{

    if("serviceWorker" in navigator){

      const registrations =
        await navigator.serviceWorker.getRegistrations();

      for(const registration of registrations){

        await registration.unregister();

      }

    }

    if("caches" in window){

      const cacheNames =
        await caches.keys();

      for(const cacheName of cacheNames){

        await caches.delete(cacheName);

      }

    }

  }catch(error){

    console.log(
      "Cache temizleme:",
      error
    );

  }

})();


/* -------------------------------
   GÖRSEL VERSİYONU
-------------------------------- */

const IMAGE_VERSION = "20261008-04";


const pitchImage =
  document.getElementById("pitchImg");

const rollImage =
  document.getElementById("rollImg");

const centerCar =
  document.getElementById("centerCar");


pitchImage.src =
  "pitch_discovery.png?v=" + IMAGE_VERSION;


rollImage.src =
  "roll_discovery.png?v=" + IMAGE_VERSION;


centerCar.src =
  "center_discovery.png?v=" + IMAGE_VERSION;


/* -------------------------------
   ELEMENTLER
-------------------------------- */

const pitchElement =
  document.getElementById("pitch");

const rollElement =
  document.getElementById("roll");

const pitchCard =
  document.getElementById("pitchCard");

const rollCard =
  document.getElementById("rollCard");

const bubble =
  document.getElementById("bubble");

const zeroButton =
  document.getElementById("zeroButton");


/* -------------------------------
   FİLTRELER
-------------------------------- */

/*
   Sensör değerlerinin sakinliği.

   Daha küçük sayı =
   daha yavaş / daha sakin

   Daha büyük sayı =
   daha hızlı / daha hareketli
*/

const SENSOR_ALPHA = 0.15;


/*
   Ortadaki yeşil balon için
   ayrıca daha sakin filtre.
*/

const BUBBLE_ALPHA = 0.15;


/* -------------------------------
   SENSOR DEĞERLERİ
-------------------------------- */

let filteredAx = 0;
let filteredAy = 0;
let filteredAz = 0;

let sensorInitialized = false;


/* -------------------------------
   HAM AÇILAR
-------------------------------- */

let pitchRaw = 0;
let rollRaw = 0;


/* -------------------------------
   SIFIRLAMA
-------------------------------- */

let zeroActive = false;

let zeroPitch = 0;
let zeroRoll = 0;


/* -------------------------------
   BALON DEĞERLERİ
-------------------------------- */

let bubblePitch = 0;
let bubbleRoll = 0;


/* -------------------------------
   0° / + / - GÖSTERİMİ
-------------------------------- */

function signed(value){

  const number =
    Math.round(value);


  /*
     -0° ve +0°
     göstermesin.
  */

  if(number === 0){

    return "0°";

  }


  if(number > 0){

    return "+" + number + "°";

  }


  return number + "°";

}


/* -------------------------------
   MAVİ ÇERÇEVE
-------------------------------- */

function updateBorder(card, angle){

  const absolute =
    Math.abs(angle);


  /*
     ±5 dereceden sonra
     normal koyu çerçeve.
  */

  if(absolute > 5){

    card.style.borderColor =
      "#27313a";

    card.style.boxShadow =
      "none";

    return;

  }


  /*
     5° = çok hafif
     0° = maksimum
  */

  const strength =
    1 - (absolute / 5);


  const alpha =
    0.15 + (strength * 0.85);


  const glow =
    8 + (strength * 25);


  card.style.borderColor =
    `color-mix(
      in srgb,
      var(--level-blue) ${alpha * 100}%,
      #27313a
    )`;


  card.style.boxShadow =
    `0 0 ${glow}px
     color-mix(
       in srgb,
       var(--level-blue) ${alpha * 45}%,
       transparent
     )`;

}


/* -------------------------------
   ÖLÇÜMÜ GÜNCELLE
-------------------------------- */

function updateLevel(){

  /*
     Dünya referansına göre
     ham açıları hesapla.
  */

  const rawPitch =
    pitchRaw;

  const rawRoll =
    rollRaw;


  /*
     Sıfırlama aktifse:

     mevcut dünya açısı
     -
     sıfırlama anındaki açı

     = göreceli açı
  */

  let displayPitch =
    rawPitch;

  let displayRoll =
    rawRoll;


  if(zeroActive){

    displayPitch =
      rawPitch - zeroPitch;

    displayRoll =
      rawRoll - zeroRoll;

  }


  /* ---------------------------
     YAZILAR
  --------------------------- */

  pitchElement.textContent =
    signed(displayPitch);


  rollElement.textContent =
    signed(displayRoll);


  /* ---------------------------
     MAVİ ÇERÇEVELER
  --------------------------- */

  updateBorder(
    pitchCard,
    displayPitch
  );


  updateBorder(
    rollCard,
    displayRoll
  );


  /* ---------------------------
     PITCH ARAÇ GÖRSELİ
  --------------------------- */

  const pitchMove =
    Math.max(
      -20,
      Math.min(
        20,
        displayPitch
      )
    );


  pitchImage.style.transform =
    `
    translateY(${pitchMove * 1.2}px)
    rotate(${displayPitch * -0.55}deg)
    scale(1.04)
    `;


  /* ---------------------------
     ROLL ARAÇ GÖRSELİ
  --------------------------- */

  const rollMove =
    Math.max(
      -20,
      Math.min(
        20,
        displayRoll
      )
    );


  rollImage.style.transform =
    `
    rotate(${displayRoll * 0.7}deg)
    translateX(${rollMove * 0.8}px)
    scale(1.04)
    `;


  /* ---------------------------
     YEŞİL BALON
  --------------------------- */

  bubblePitch +=
    (
      displayPitch -
      bubblePitch
    ) * BUBBLE_ALPHA;


  bubbleRoll +=
    (
      displayRoll -
      bubbleRoll
    ) * BUBBLE_ALPHA;


  /*
     Balonun hareket alanı
     ±10 derece.
  */

  const x =
    Math.max(
      -10,
      Math.min(
        10,
        bubbleRoll
      )
    );


  const y =
    Math.max(
      -10,
      Math.min(
        10,
        bubblePitch
      )
    );


  bubble.style.left =
    (50 + x * 4) + "%";


  bubble.style.top =
    (50 - y * 4) + "%";

}


/* -------------------------------
   HAREKET SENSÖRÜ
-------------------------------- */

function motion(event){

  const acceleration =
    event.accelerationIncludingGravity;


  if(!acceleration){

    return;

  }


  const ax =
    acceleration.x || 0;

  const ay =
    acceleration.y || 0;

  const az =
    acceleration.z || 0;


  /*
     İlk sensör değerini
     direkt kabul et.
  */

  if(!sensorInitialized){

    filteredAx = ax;
    filteredAy = ay;
    filteredAz = az;

    sensorInitialized = true;

  }else{

    /*
       Low-pass filter.
    */

    filteredAx +=
      (ax - filteredAx) *
      SENSOR_ALPHA;


    filteredAy +=
      (ay - filteredAy) *
      SENSOR_ALPHA;


    filteredAz +=
      (az - filteredAz) *
      SENSOR_ALPHA;

  }


  /* ---------------------------
     PITCH
  --------------------------- */

  pitchRaw =
    Math.atan2(
      filteredAz,
      Math.sqrt(
        filteredAx * filteredAx +
        filteredAy * filteredAy
      )
    )
    *
    180 /
    Math.PI;


  /* ---------------------------
     ROLL
  --------------------------- */

  rollRaw =
    Math.atan2(
      filteredAx,
      Math.sqrt(
        filteredAy * filteredAy +
        filteredAz * filteredAz
      )
    )
    *
    180 /
    Math.PI;


  updateLevel();

}


/* =========================================================
   SIFIRLAMA BUTONU
   ========================================================= */

zeroButton.addEventListener(
  "click",
  function(){

    /*
       Şu anda sıfırlama aktif değilse
       mevcut pozisyonu referans olarak kaydet.
    */

    if(!zeroActive){

      zeroPitch =
        pitchRaw;

      zeroRoll =
        rollRaw;


      zeroActive =
        true;


      /*
         Yeşil balonu da
         anında merkeze yaklaştır.
      */

      bubblePitch = 0;
      bubbleRoll = 0;


      zeroButton.classList.add(
        "active"
      );


      zeroButton.setAttribute(
        "aria-label",
        "Sıfırlamayı iptal et"
      );


      zeroButton.title =
        "Yerçekimi referansına dön";


    }else{

      /*
         Tekrar basılırsa
         Dünya referansına dön.
      */

      zeroActive =
        false;


      zeroPitch =
        0;

      zeroRoll =
        0;


      /*
         Balonu da tekrar
         dünya referansına göre
         çalıştır.
      */

      bubblePitch =
        0;

      bubbleRoll =
        0;


      zeroButton.classList.remove(
        "active"
      );


      zeroButton.setAttribute(
        "aria-label",
        "Ölçümü sıfırla"
      );


      zeroButton.title =
        "Sıfırla";


      updateLevel();

    }

  }
);


/* =========================================================
   ÖLÇÜMÜ BAŞLAT
   ========================================================= */

const startButton =
  document.getElementById(
    "startButton"
  );

const startScreen =
  document.getElementById(
    "start"
  );


startButton.addEventListener(
  "click",
  async function(){

    /*
       iPhone Safari
       DeviceMotion izni.
    */

    if(
      typeof DeviceMotionEvent !==
      "undefined" &&

      typeof DeviceMotionEvent.requestPermission ===
      "function"
    ){

      try{

        const permission =
          await DeviceMotionEvent.requestPermission();


        if(permission !== "granted"){

          alert(
            "Hareket sensörü izni verilmedi."
          );

          return;

        }

      }catch(error){

        alert(
          "Hareket sensörü başlatılamadı."
        );

        console.error(error);

        return;

      }

    }


    /*
       Sensörü başlat.
    */

    window.addEventListener(
      "devicemotion",
      motion,
      true
    );


    /*
       Başlangıç ekranını kapat.
    */

    startScreen.classList.add(
      "hidden"
    );


  }
);


/* =========================================================
   İLK GÖRÜNTÜ
   ========================================================= */

updateLevel();

</script>
