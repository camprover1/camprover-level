<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Camprover Level</title>


<style>

/* ================================================= */
/* TEMEL RENKLER */
/* ================================================= */

:root{

  --bg:#080b0f;

  --panel:#11161c;
  --panel2:#151b22;

  --border:#27313a;

  --text:#f2f5f7;

  --muted:#7e8993;

  /* MAVİ TONUNU BURADAN DEĞİŞTİREBİLİRSİN */
  --level-blue:#00A8FF;

  --green:#20e890;

  --red:#ff4d5e;

}


/* ================================================= */
/* RESET */
/* ================================================= */

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}


html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

}


body{

  display:flex;

  align-items:center;

  justify-content:center;

}


/* ================================================= */
/* ANA UYGULAMA */
/* ================================================= */

.app{

  width:min(1400px,100vw);

  height:100vh;

  min-height:0;

  padding:18px;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


/* ================================================= */
/* HEADER */
/* ================================================= */

.header{

  flex-shrink:0;

  text-align:center;

  margin-bottom:15px;

}


.header h1{

  margin:0;

  font-size:25px;

  font-weight:700;

  letter-spacing:4px;

}


.header p{

  margin:5px 0 0;

  color:var(--muted);

  font-size:11px;

  letter-spacing:2px;

}


/* ================================================= */
/* DASHBOARD */
/* ================================================= */

.dashboard{

  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(230px,1fr)
    minmax(420px,1.5fr)
    minmax(230px,1fr);

  gap:20px;

  align-items:stretch;

}


/* ================================================= */
/* KARTLAR */
/* ================================================= */

.card{

  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.005)
    ),
    var(--panel);

  border:4px solid var(--border);

  border-radius:22px;

  padding:20px;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  transition:
    border-color .35s ease,
    box-shadow .35s ease;

}


.card-title{

  color:var(--muted);

  font-size:12px;

  font-weight:700;

  letter-spacing:3px;

  text-align:center;

}


.value{

  text-align:center;

  font-size:46px;

  font-weight:700;

  line-height:1;

  margin-top:16px;

  font-variant-numeric:tabular-nums;

}


/* ================================================= */
/* MAVİ SEVİYE ÇERÇEVESİ */
/* ================================================= */

.card.level-0{

  border-color:var(--level-blue);

  box-shadow:

    0 0 5px var(--level-blue),

    0 0 15px rgba(0,168,255,.45),

    inset 0 0 15px rgba(0,168,255,.08);

}


.card.level-1{

  border-color:rgba(0,168,255,.78);

  box-shadow:

    0 0 8px rgba(0,168,255,.35);

}


.card.level-2{

  border-color:rgba(0,168,255,.58);

}


.card.level-3{

  border-color:rgba(0,168,255,.40);

}


.card.level-4{

  border-color:rgba(0,168,255,.22);

}


.card.level-5{

  border-color:var(--border);

  box-shadow:none;

}


/* ================================================= */
/* ARAÇ GÖRSELLERİ */
/* ================================================= */

.vehicle-area{

  flex:1;

  min-height:0;

  margin-top:15px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.vehicle-area img{

  width:92%;

  max-width:380px;

  height:auto;

  object-fit:contain;

  transition:
    transform .25s ease;

}


/* ================================================= */
/* MERKEZ PANEL */
/* ================================================= */

.center-panel{

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:0;

}


/* ================================================= */
/* YUVARLAK TERAZİ */
/* ================================================= */

.level{

  position:relative;

  width:min(440px,80vw);

  height:min(440px,80vw);

  max-width:100%;

  max-height:100%;

  border-radius:50%;

  background:

    radial-gradient(
      circle at center,
      #151d24 0%,
      #0e141a 65%,
      #090d11 100%
    );

  border:2px solid #26313a;

  box-shadow:

    inset 0 0 35px rgba(0,0,0,.8),

    0 15px 35px rgba(0,0,0,.35);

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


/* ================================================= */
/* TERAZİ ÇİZGİLERİ */
/* ================================================= */

.level::before{

  content:"";

  position:absolute;

  left:8%;

  right:8%;

  top:50%;

  height:1px;

  background:rgba(255,255,255,.10);

  transform:translateY(-50%);

}


.level::after{

  content:"";

  position:absolute;

  top:8%;

  bottom:8%;

  left:50%;

  width:1px;

  background:rgba(255,255,255,.10);

  transform:translateX(-50%);

}


/* ================================================= */
/* YEŞİL SU TERAZİSİ BALONU */
/* ================================================= */

.bubble{

  position:absolute;

  width:36px;

  height:36px;

  border-radius:50%;

  background:

    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.95),
      rgba(30,232,144,.8) 25%,
      rgba(20,180,110,.75) 65%,
      rgba(0,0,0,.25) 100%
    );

  box-shadow:

    0 0 12px rgba(32,232,144,.75),

    inset 0 0 8px rgba(255,255,255,.35);

  transform:

    translate(
      var(--bubble-x,0px),
      var(--bubble-y,0px)
    );

  transition:

    transform .18s ease;

  z-index:5;

}


/* ================================================= */
/* MERKEZ DISCOVERY */
/* ================================================= */

.center-car{

  position:absolute;

  width:52%;

  height:auto;

  object-fit:contain;

  pointer-events:none;

  z-index:4;

  opacity:.95;

  transition:
    transform .18s ease;

}


/* ================================================= */
/* GRAVITY LEVEL YAZISI */
/* ================================================= */

.gravity-label{

  position:absolute;

  left:50%;

  bottom:9%;

  transform:translateX(-50%);

  padding:12px 25px;

  border-radius:30px;

  background:rgba(5,15,12,.72);

  border:1px solid rgba(32,232,144,.18);

  color:#9aa7a7;

  font-size:12px;

  font-weight:500;

  letter-spacing:4px;

  white-space:nowrap;

  z-index:10;

  box-shadow:

    0 0 12px rgba(32,232,144,.08),

    inset 0 0 12px rgba(32,232,144,.04);

}


/* ================================================= */
/* RESET BUTONU */
/* ================================================= */

.zero-button{

  position:absolute;

  left:
    calc(
      50%
      - min(440px,80vw)/2
      - 38px
    );

  top:50%;

  transform:translateY(-50%);

  width:32px;

  height:32px;

  padding:0;

  border-radius:50%;

  border:2px solid #27313a;

  background:#111820;

  color:#8d99a3;

  font-size:19px;

  line-height:28px;

  cursor:pointer;

  outline:none;

  z-index:30;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:

    border-color .25s ease,

    box-shadow .25s ease,

    color .25s ease,

    background .25s ease,

    transform .15s ease;

}


.zero-button:active{

  transform:

    translateY(-50%)

    scale(.90);

}


.zero-button.active{

  border-color:var(--level-blue);

  color:#ffffff;

  background:#0c1720;

  box-shadow:

    0 0 5px var(--level-blue),

    0 0 12px rgba(0,168,255,.55),

    0 0 20px rgba(0,168,255,.22);

}


/* ================================================= */
/* FOOTER */
/* ================================================= */

.footer{

  flex-shrink:0;

  text-align:center;

  margin-top:10px;

  color:#53606b;

  font-size:9px;

  letter-spacing:1px;

}


/* ================================================= */
/* ================================================= */
/* MOBİL */
/* ================================================= */
/* ================================================= */

@media(max-width:900px){

  body{

    align-items:center;

    overflow:hidden;

  }


  .app{

    width:100vw;

    height:100dvh;

    min-height:0;

    padding:8px;

    overflow:hidden;

  }


  .header{

    margin-bottom:5px;

    flex-shrink:0;

  }


  .header h1{

    font-size:16px;

    letter-spacing:2px;

  }


  .header p{

    margin-top:2px;

    font-size:8px;

  }


  /*
    MOBİL DÜZEN

    ÜST:
    BÜYÜK TERAZİ

    ALT:
    PITCH | ROLL
  */

  .dashboard{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
      1fr
      1fr;

    grid-template-rows:
      minmax(0,1.25fr)
      minmax(0,1fr);

    gap:7px;

    align-items:stretch;

  }


  /* ================================================= */
  /* TERAZİ ÜSTTE */
/* ================================================= */

  .center-panel{

    grid-column:1 / 3;

    grid-row:1;

    min-height:0;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:visible;

  }


  .center-panel .level{

    width:min(82vw,42vh);

    height:min(82vw,42vh);

    max-width:100%;

    max-height:100%;

    flex-shrink:0;

  }


  .center-car{

    width:52%;

  }


  /* ================================================= */
  /* PITCH ALT SOL */
  /* ================================================= */

  .card:first-child{

    grid-column:1;

    grid-row:2;

    min-height:0;

    height:100%;

    border-radius:16px;

    padding:8px;

    overflow:hidden;

  }


  /* ================================================= */
  /* ROLL ALT SAĞ */
  /* ================================================= */

  .card:last-child{

    grid-column:2;

    grid-row:2;

    min-height:0;

    height:100%;

    border-radius:16px;

    padding:8px;

    overflow:hidden;

  }


  .card-title{

    font-size:9px;

    letter-spacing:2px;

  }


  .value{

    font-size:30px;

    margin-top:7px;

  }


  .vehicle-area{

    min-height:0;

    margin-top:4px;

  }


  .vehicle-area img{

    width:94%;

    max-width:none;

  }


  /* ================================================= */
  /* RESET BUTONU */
  /* ================================================= */

  .zero-button{

    left:
      calc(
        50%
        - min(82vw,42vh)/2
        - 35px
      );

    width:30px;

    height:30px;

    font-size:18px;

  }


  .footer{

    display:none;

  }


  /* ================================================= */
  /* GRAVITY LEVEL */
  /* ================================================= */

  .gravity-label{

    padding:10px 20px;

    font-size:10px;

    letter-spacing:3px;

  }

}


/* ================================================= */
/* KÜÇÜK TELEFON */
/* ================================================= */

@media(max-width:430px){

  .app{

    padding:6px;

  }


  .header{

    margin-bottom:4px;

  }


  .header h1{

    font-size:14px;

  }


  .header p{

    font-size:7px;

  }


  .dashboard{

    gap:5px;

  }


  /* ================================================= */
  /* TERAZİ */
  /* ================================================= */

  .center-panel .level{

    width:min(80vw,39vh);

    height:min(80vw,39vh);

  }


  /* ================================================= */
  /* PITCH + ROLL */
  /* ================================================= */

  .card:first-child,
  .card:last-child{

    border-radius:13px;

    padding:6px;

    border-width:3px;

  }


  .card-title{

    font-size:8px;

    letter-spacing:1.5px;

  }


  .value{

    font-size:25px;

    margin-top:5px;

  }


  .vehicle-area{

    margin-top:2px;

  }


  /* ================================================= */
  /* RESET */
  /* ================================================= */

  .zero-button{

    left:
      calc(
        50%
        - min(80vw,39vh)/2
        - 32px
      );

    width:26px;

    height:26px;

    font-size:16px;

  }


  /* ================================================= */
  /* GRAVITY LEVEL */
  /* ================================================= */

  .gravity-label{

    padding:9px 18px;

    font-size:9px;

    letter-spacing:3px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div class="header">

    <h1>
      CAMPROVER LEVEL
    </h1>

    <p>
      LAND ROVER DISCOVERY 2 • EĞİM ÖLÇER
    </p>

  </div>


  <!-- ================================================= -->
  <!-- DASHBOARD -->
  <!-- ================================================= -->

  <div class="dashboard">


    <!-- ================================================= -->
    <!-- PITCH -->
    <!-- ================================================= -->

    <div
      id="pitchCard"
      class="card level-5"
    >

      <div class="card-title">
        PITCH
      </div>


      <div
        id="pitchValue"
        class="value"
      >
        +0°
      </div>


      <div class="vehicle-area">

        <img
          id="pitchImage"
          alt="Discovery 2 Pitch"
        >

      </div>

    </div>


    <!-- ================================================= -->
    <!-- CENTER LEVEL -->
    <!-- ================================================= -->

    <div class="center-panel">


      <div
        id="level"
        class="level"
      >


        <!-- YEŞİL BALON -->

        <div
          id="bubble"
          class="bubble"
        ></div>


        <!-- DISCOVERY -->

        <img
          id="centerCar"
          class="center-car"
          alt="Discovery 2"
        >


        <!-- GRAVITY LEVEL -->

        <div class="gravity-label">
          GRAVITY LEVEL
        </div>


      </div>


      <!-- RESET -->

      <button
        id="zeroButton"
        class="zero-button"
        aria-label="Ölçümü sıfırla"
        title="Ölçümü sıfırla"
      >↻</button>


    </div>


    <!-- ================================================= -->
    <!-- ROLL -->
    <!-- ================================================= -->

    <div
      id="rollCard"
      class="card level-5"
    >

      <div class="card-title">
        ROLL
      </div>


      <div
        id="rollValue"
        class="value"
      >
        +0°
      </div>


      <div class="vehicle-area">

        <img
          id="rollImage"
          alt="Discovery 2 Roll"
        >

      </div>

    </div>


  </div>


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <div class="footer">
    CAMPROVER • SENSOR BASED VEHICLE LEVEL
  </div>


</div>



<script>


/* ================================================= */
/* SERVICE WORKER / CACHE TEMİZLİĞİ */
/* ================================================= */

(async function(){

  try{

    if("serviceWorker" in navigator){

      const registrations =
        await navigator.serviceWorker.getRegistrations();

      for(
        const registration
        of registrations
      ){

        await registration.unregister();

      }

    }


    if("caches" in window){

      const keys =
        await caches.keys();

      for(
        const key
        of keys
      ){

        await caches.delete(key);

      }

    }

  }catch(e){

    console.log(
      "Cache temizleme:",
      e
    );

  }

})();



/* ================================================= */
/* GÖRSEL VERSİYONU */
/* ================================================= */

const IMAGE_VERSION =
  "20261008-07";



/* ================================================= */
/* GÖRSELLER */
/* ================================================= */

const pitchImage =
  document.getElementById(
    "pitchImage"
  );


const rollImage =
  document.getElementById(
    "rollImage"
  );


const centerCar =
  document.getElementById(
    "centerCar"
  );



pitchImage.src =
  "pitch_discovery.png?v=" +
  IMAGE_VERSION;


rollImage.src =
  "roll_discovery.png?v=" +
  IMAGE_VERSION;


centerCar.src =
  "roll_discovery.png?v=" +
  IMAGE_VERSION;



/* ================================================= */
/* ELEMENTLER */
/* ================================================= */

const pitchValue =
  document.getElementById(
    "pitchValue"
  );


const rollValue =
  document.getElementById(
    "rollValue"
  );


const pitchCard =
  document.getElementById(
    "pitchCard"
  );


const rollCard =
  document.getElementById(
    "rollCard"
  );


const bubble =
  document.getElementById(
    "bubble"
  );


const zeroButton =
  document.getElementById(
    "zeroButton"
  );



/* ================================================= */
/* FİLTRE */
/* ================================================= */

const SENSOR_ALPHA =
  0.15;


const BUBBLE_ALPHA =
  0.15;



/* ================================================= */
/* SENSOR DEĞİŞKENLERİ */
/* ================================================= */

let filteredAx =
  0;


let filteredAy =
  0;


let filteredAz =
  0;


let firstSensorReading =
  true;



/* ================================================= */
/* BUBBLE */
/* ================================================= */

let bubblePitch =
  0;


let bubbleRoll =
  0;



/* ================================================= */
/* RESET */
/* ================================================= */

let zeroActive =
  false;


let zeroPitch =
  0;


let zeroRoll =
  0;


let pitchRaw =
  0;


let rollRaw =
  0;



/* ================================================= */
/* KART SEVİYESİ */
/* ================================================= */

function updateCardLevel(
  card,
  value
){

  card.classList.remove(
    "level-0",
    "level-1",
    "level-2",
    "level-3",
    "level-4",
    "level-5"
  );


  const absValue =
    Math.abs(value);


  if(
    absValue <= 0.5
  ){

    card.classList.add(
      "level-0"
    );

  }

  else if(
    absValue <= 1
  ){

    card.classList.add(
      "level-1"
    );

  }

  else if(
    absValue <= 2
  ){

    card.classList.add(
      "level-2"
    );

  }

  else if(
    absValue <= 3
  ){

    card.classList.add(
      "level-3"
    );

  }

  else if(
    absValue <= 5
  ){

    card.classList.add(
      "level-4"
    );

  }

  else{

    card.classList.add(
      "level-5"
    );

  }

}



/* ================================================= */
/* DERECE FORMAT */
/* ================================================= */

function formatDegree(
  value
){

  const rounded =
    Math.round(value);


  if(
    rounded > 0
  ){

    return "+" +
      rounded +
      "°";

  }


  return rounded +
    "°";

}



/* ================================================= */
/* LEVEL UPDATE */
/* ================================================= */

function updateLevel(){


  let displayPitch =
    pitchRaw;


  let displayRoll =
    rollRaw;



  /* ================================================= */
  /* RESET AKTİFSE */
/* ================================================= */

  if(
    zeroActive
  ){

    displayPitch =
      pitchRaw -
      zeroPitch;


    displayRoll =
      rollRaw -
      zeroRoll;

  }



  /* ================================================= */
  /* DERECELER */
/* ================================================= */

  pitchValue.textContent =
    formatDegree(
      displayPitch
    );


  rollValue.textContent =
    formatDegree(
      displayRoll
    );



  /* ================================================= */
  /* KART ÇERÇEVESİ */
/* ================================================= */

  updateCardLevel(
    pitchCard,
    displayPitch
  );


  updateCardLevel(
    rollCard,
    displayRoll
  );



  /* ================================================= */
  /* BALON FİLTRESİ */
/* ================================================= */

  bubblePitch +=
    (
      displayPitch -
      bubblePitch
    ) *
    BUBBLE_ALPHA;


  bubbleRoll +=
    (
      displayRoll -
      bubbleRoll
    ) *
    BUBBLE_ALPHA;



  /* ================================================= */
  /* BALON HAREKETİ */
/* ================================================= */

  const maxMove =
    115;


  const bubbleX =
    Math.max(
      -maxMove,

      Math.min(
        maxMove,

        bubbleRoll * 7
      )
    );


  const bubbleY =
    Math.max(
      -maxMove,

      Math.min(
        maxMove,

        bubblePitch * 7
      )
    );



  bubble.style.setProperty(
    "--bubble-x",
    bubbleX + "px"
  );


  bubble.style.setProperty(
    "--bubble-y",
    bubbleY + "px"
  );



  /* ================================================= */
  /* PITCH ARACI */
/* ================================================= */

  const pitchMove =
    Math.max(
      -100,

      Math.min(
        100,

        displayPitch * 5
      )
    );


  pitchImage.style.transform =
    `translateY(${pitchMove * 1.2}px)`;



  /* ================================================= */
  /* ROLL ARACI */
/* ================================================= */

  const rollMove =
    Math.max(
      -100,

      Math.min(
        100,

        displayRoll * 5
      )
    );


  rollImage.style.transform =
    `rotate(${rollMove}deg)`;

}



/* ================================================= */
/* SENSOR */
/* ================================================= */

function handleMotion(
  event
){

  if(
    !event.accelerationIncludingGravity
  ){

    return;

  }


  const a =
    event.accelerationIncludingGravity;


  const ax =
    a.x || 0;


  const ay =
    a.y || 0;


  const az =
    a.z || 0;



  /* ================================================= */
  /* SENSOR FİLTRESİ */
/* ================================================= */

  if(
    firstSensorReading
  ){

    filteredAx =
      ax;

    filteredAy =
      ay;

    filteredAz =
      az;

    firstSensorReading =
      false;

  }

  else{

    filteredAx +=
      (
        ax -
        filteredAx
      ) *
      SENSOR_ALPHA;


    filteredAy +=
      (
        ay -
        filteredAy
      ) *
      SENSOR_ALPHA;


    filteredAz +=
      (
        az -
        filteredAz
      ) *
      SENSOR_ALPHA;

  }



  /* ================================================= */
  /* PITCH */
/* ================================================= */

  pitchRaw =

    Math.atan2(

      filteredAz,

      Math.sqrt(

        filteredAx *
        filteredAx +

        filteredAy *
        filteredAy

      )

    )

    *

    180 /

    Math.PI;



  /* ================================================= */
  /* ROLL */
/* ================================================= */

  rollRaw =

    Math.atan2(

      filteredAx,

      Math.sqrt(

        filteredAy *
        filteredAy +

        filteredAz *
        filteredAz

      )

    )

    *

    180 /

    Math.PI;



  updateLevel();

}



/* ================================================= */
/* SENSOR BAŞLAT */
/* ================================================= */

async function startSensor(){

  try{


    /* ================================================= */
    /* iOS SENSOR İZNİ */
    /* ================================================= */

    if(

      typeof DeviceMotionEvent !==
      "undefined"

      &&

      typeof DeviceMotionEvent.requestPermission ===
      "function"

    ){

      const permission =

        await
        DeviceMotionEvent
        .requestPermission();


      if(
        permission !==
        "granted"
      ){

        alert(
          "Hareket sensörü izni verilmedi."
        );

        return;

      }

    }



    /* ================================================= */
    /* SENSOR DİNLE */
/* ================================================= */

    window.addEventListener(

      "devicemotion",

      handleMotion,

      true

    );



    /* ================================================= */
    /* BAŞLANGIÇ EKRANINI KALDIR */
/* ================================================= */

    const startScreen =
      document.getElementById(
        "startScreen"
      );


    if(
      startScreen
    ){

      startScreen.remove();

    }


  }

  catch(error){

    console.error(
      error
    );


    alert(
      "Sensör başlatılamadı."
    );

  }

}



/* ================================================= */
/* BAŞLANGIÇ EKRANI */

`;



startScreen.innerHTML = `

<div style="

CAMPROVER LEVEL

/* ================================================= */
/* RESET BUTONU */
/* ================================================= */

zeroButton.addEventListener(

  "click",

  function(){


    /* ================================================= */
    /* İLK BASIŞ */
/* ================================================= */

    if(
      !zeroActive
    ){

      zeroPitch =
        pitchRaw;


      zeroRoll =
        rollRaw;


      zeroActive =
        true;



      bubblePitch =
        0;


      bubbleRoll =
        0;



      zeroButton
        .classList
        .add(
          "active"
        );


      zeroButton
        .setAttribute(
          "aria-label",
          "Sıfırlamayı iptal et"
        );


      zeroButton.title =
        "Yerçekimi referansına dön";


      updateLevel();

    }


    /* ================================================= */
    /* İKİNCİ BASIŞ */
/* ================================================= */

    else{

      zeroActive =
        false;


      zeroPitch =
        0;


      zeroRoll =
        0;


      bubblePitch =
        0;


      bubbleRoll =
        0;


      zeroButton
        .classList
        .remove(
          "active"
        );


      zeroButton
        .setAttribute(
          "aria-label",
          "Ölçümü sıfırla"
        );


      zeroButton.title =
        "Ölçümü sıfırla";


      updateLevel();

    }

  }

);

</script>
