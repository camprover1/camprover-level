<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta http-equiv="Cache-Control"
      content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Camprover Level</title>

<style>

:root{
    --bg:#050607;
    --panel:#0c0f11;
    --panel2:#101416;
    --border:#20272b;
    --text:#f4f7f8;
    --muted:#8d989d;

    --level-blue:#00A8FF;

    --green:#22ff75;
    --green-soft:#18d965;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;

    overflow:hidden;

    background:var(--bg);
    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}


/* ==================================================
   CAMPROVER
================================================== */

.brand{

    position:fixed;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    font-size:18px;

    font-weight:700;

    letter-spacing:6px;

    color:#dfe7e9;

    opacity:.85;

    text-shadow:
        0 0 8px rgba(0,168,255,.18),
        0 0 14px rgba(34,255,117,.08);

    pointer-events:none;

    user-select:none;
}


/* ==================================================
   ALTITUDE
================================================== */

.altitude{

    position:fixed;

    top:38px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    display:flex;

    align-items:baseline;

    gap:6px;

    white-space:nowrap;

    pointer-events:none;

    user-select:none;
}

.altitudeLabel{

    font-size:9px;

    font-weight:600;

    letter-spacing:2px;

    color:#758086;

    opacity:.85;
}

.altitudeValue{

    font-size:13px;

    font-weight:600;

    letter-spacing:.5px;

    color:#b9c3c7;

    text-shadow:
        0 0 6px rgba(255,255,255,.05);
}


/* ==================================================
   DASHBOARD
================================================== */

.dashboard{

    width:100%;
    height:100%;

    max-width:1500px;

    display:grid;

    grid-template-columns:
        minmax(220px,1fr)
        minmax(360px,1.5fr)
        minmax(220px,1fr);

    gap:18px;

    padding:18px;
}


/* ==================================================
   PANELS
================================================== */

.panel{

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.005)
        ),
        var(--panel);

    border:4px solid var(--border);

    border-radius:24px;

    overflow:hidden;

    transition:
        border-color .25s ease,
        box-shadow .25s ease;
}

.panelTitle{

    position:absolute;

    top:20px;
    left:0;
    right:0;

    text-align:center;

    font-size:15px;
    font-weight:700;

    letter-spacing:2px;

    color:var(--muted);

    z-index:10;
}


/* ==================================================
   VALUE
================================================== */

.value{

    position:absolute;

    left:0;
    right:0;

    top:62px;

    text-align:center;

    font-size:52px;

    font-weight:700;

    letter-spacing:-2px;

    line-height:1;

    z-index:20;
}

.unit{
    font-size:.5em;
    margin-left:2px;
    opacity:.75;
}


/* ==================================================
   VEHICLE IMAGE
================================================== */

.vehicleWrap{

    position:absolute;

    left:12%;
    right:12%;

    top:50%;
    bottom:10%;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.vehicle{

    width:82%;
    max-width:330px;

    height:auto;

    object-fit:contain;

    transform-origin:center center;

    transition:none;

    will-change:transform;

    user-select:none;
    -webkit-user-drag:none;
}


/* ==================================================
   BLUE LEVEL STATES
================================================== */

.panel.level-5{
    border-color:var(--border);
    box-shadow:none;
}

.panel.level-4{
    border-color:
        color-mix(
            in srgb,
            var(--level-blue) 22%,
            var(--border)
        );
}

.panel.level-3{
    border-color:
        color-mix(
            in srgb,
            var(--level-blue) 40%,
            var(--border)
        );
}

.panel.level-2{
    border-color:
        color-mix(
            in srgb,
            var(--level-blue) 60%,
            var(--border)
        );
}

.panel.level-1{
    border-color:
        color-mix(
            in srgb,
            var(--level-blue) 82%,
            var(--border)
        );
}

.panel.level-0{

    border-color:var(--level-blue);

    box-shadow:
        0 0 8px
            color-mix(
                in srgb,
                var(--level-blue) 60%,
                transparent
            ),
        inset 0 0 18px
            color-mix(
                in srgb,
                var(--level-blue) 14%,
                transparent
            );
}


/* ==================================================
   CENTER PANEL
================================================== */

.centerPanel{

    display:flex;

    align-items:center;
    justify-content:center;
}


/* ==================================================
   CIRCULAR LEVEL
================================================== */

.level{

    position:relative;

    width:min(72vh,520px);
    height:min(72vh,520px);

    max-width:90%;
    max-height:90%;

    aspect-ratio:1/1;

    border-radius:50%;

    overflow:hidden;

    background:#07130d;

    border:5px solid #183b28;

    box-shadow:
        inset 0 0 35px rgba(0,255,100,.12),
        0 0 25px rgba(0,255,100,.05);
}


/* ==================================================
   GREEN LIQUID
================================================== */

.liquid{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(40,255,110,.25) 0%,
            rgba(20,180,70,.17) 35%,
            rgba(0,70,25,.38) 70%,
            rgba(0,25,10,.7) 100%
        );

    overflow:hidden;
}

.liquid::before{

    content:"";

    position:absolute;

    inset:-20%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(35,255,110,.18),
            transparent 58%
        );

    animation:
        liquidPulse 4s ease-in-out infinite;
}

@keyframes liquidPulse{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.04);
        opacity:1;
    }
}


/* ==================================================
   AXIS
================================================== */

.axis{

    position:absolute;

    background:rgba(80,255,140,.18);

    pointer-events:none;
}

.axis.horizontal{

    left:8%;
    right:8%;

    top:50%;

    height:1px;

    transform:translateY(-50%);
}

.axis.vertical{

    top:8%;
    bottom:8%;

    left:50%;

    width:1px;

    transform:translateX(-50%);
}


/* ==================================================
   DEGREE TICKS
================================================== */

.tick{

    position:absolute;

    background:rgba(90,255,145,.42);

    pointer-events:none;
}

.tick.horizontal{

    width:2px;
    height:10px;

    top:50%;

    transform:translateY(-50%);
}

.tick.vertical{

    width:10px;
    height:2px;

    left:50%;

    transform:translateX(-50%);
}

.tick.x1{ left:25%; }
.tick.x2{ left:37.5%; }
.tick.x3{ left:62.5%; }
.tick.x4{ left:75%; }

.tick.y1{ top:25%; }
.tick.y2{ top:37.5%; }
.tick.y3{ top:62.5%; }
.tick.y4{ top:75%; }


/* ==================================================
   LEVEL LABELS
================================================== */

.levelLabel{

    position:absolute;

    color:rgba(130,255,165,.65);

    font-size:12px;

    font-weight:600;

    pointer-events:none;

    text-shadow:
        0 0 6px rgba(30,255,100,.2);
}

.labelTop{

    top:9%;
    left:50%;

    transform:translateX(-50%);
}

.labelBottom{

    bottom:9%;
    left:50%;

    transform:translateX(-50%);
}

.labelLeft{

    left:9%;
    top:50%;

    transform:translateY(-50%);
}

.labelRight{

    right:9%;
    top:50%;

    transform:translateY(-50%);
}


/* ==================================================
   CENTER DOT
================================================== */

.center-dot{

    position:absolute;

    width:8px;
    height:8px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#35ff80;

    box-shadow:
        0 0 8px #35ff80,
        0 0 16px rgba(53,255,128,.6);

    z-index:10;
}


/* ==================================================
   BUBBLE
================================================== */

.bubble{

    position:absolute;

    left:50%;
    top:50%;

    width:76px;
    height:76px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(190,255,210,.95) 0%,
            rgba(50,255,125,.85) 25%,
            rgba(15,220,80,.55) 55%,
            rgba(0,100,35,.35) 100%
        );

    border:
        2px solid
        rgba(150,255,180,.8);

    box-shadow:

        0 0 12px
            rgba(40,255,110,.7),

        0 0 30px
            rgba(30,255,90,.35),

        inset 0 0 15px
            rgba(180,255,200,.2);

    z-index:9;

    will-change:transform;
}


/* ==================================================
   START SCREEN
================================================== */

.startScreen{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#050607;
}

.startButton{

    appearance:none;

    border:2px solid var(--level-blue);

    background:
        rgba(0,168,255,.08);

    color:white;

    padding:18px 32px;

    border-radius:18px;

    font-size:18px;

    font-weight:700;

    letter-spacing:1px;

    box-shadow:
        0 0 20px
        rgba(0,168,255,.15);

    cursor:pointer;
}

.startButton:active{
    transform:scale(.97);
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width:700px){

    body{
        align-items:stretch;
    }

    .brand{

        top:7px;

        font-size:15px;

        letter-spacing:5px;
    }

    .altitude{

        top:29px;

        gap:5px;
    }

    .altitudeLabel{

        font-size:8px;

        letter-spacing:1.5px;
    }

    .altitudeValue{

        font-size:12px;
    }

    .dashboard{

        width:100%;
        height:100dvh;

        padding:
            max(47px, env(safe-area-inset-top))
            8px
            max(8px, env(safe-area-inset-bottom))
            8px;

        gap:8px;

        grid-template-columns:1fr 1fr;

        grid-template-rows:
            minmax(285px,1.30fr)
            minmax(0,1fr);
    }

    .centerPanel{

        grid-column:1 / 3;
        grid-row:1;
    }

    .pitchPanel{

        grid-column:1;
        grid-row:2;
    }

    .rollPanel{

        grid-column:2;
        grid-row:2;
    }

    .panel{

        border-width:3px;

        border-radius:18px;
    }

    .panelTitle{

        top:13px;

        font-size:12px;

        letter-spacing:1.5px;
    }

    .value{

        top:42px;

        font-size:39px;
    }

    .vehicleWrap{

        left:5%;
        right:5%;

        top:45%;
        bottom:5%;
    }

    .vehicle{

        width:90%;
    }

    .level{

        width:min(78vw,390px);
        height:min(78vw,390px);

        max-width:82%;
        max-height:82%;

        border-width:4px;
    }

    .bubble{

        width:62px;
        height:62px;
    }

    .levelLabel{

        font-size:10px;
    }
}


/* ==================================================
   SHORT MOBILE
================================================== */

@media (max-height:700px) and (max-width:700px){

    .dashboard{

        grid-template-rows:
            minmax(235px,1.15fr)
            minmax(0,1fr);
    }

    .level{

        max-width:68%;
        max-height:82%;
    }

    .bubble{

        width:54px;
        height:54px;
    }

    .value{

        font-size:34px;
    }

    .panelTitle{

        top:10px;
    }
}

</style>
</head>


<body>


<!-- ==================================================
     CAMPROVER
================================================== -->

<div class="brand">
    CAMPROVER
</div>


<!-- ==================================================
     ALTITUDE
================================================== -->

<div class="altitude">

    <span class="altitudeLabel">
        RAKIM
    </span>

    <span
        class="altitudeValue"
        id="altitudeValue">
        -- m
    </span>

</div>


<!-- ==================================================
     DASHBOARD
================================================== -->

<div class="dashboard">


    <!-- ==============================================
         ÖN - ARKA DENGE
    =============================================== -->

    <section
        class="panel pitchPanel"
        id="pitchPanel">

        <div class="panelTitle">
            ÖN - ARKA DENGE
        </div>

        <div
            class="value"
            id="pitchValue">

            +0<span class="unit">°</span>

        </div>

        <div class="vehicleWrap">

            <img
                id="pitchImage"
                class="vehicle"
                alt="Discovery pitch">

        </div>

    </section>


    <!-- ==============================================
         CENTER LEVEL
    =============================================== -->

    <section
        class="panel centerPanel"
        id="centerPanel">

        <div class="level">

            <div class="liquid">

                <div class="axis horizontal"></div>

                <div class="axis vertical"></div>


                <div class="tick horizontal x1"></div>
                <div class="tick horizontal x2"></div>
                <div class="tick horizontal x3"></div>
                <div class="tick horizontal x4"></div>


                <div class="tick vertical y1"></div>
                <div class="tick vertical y2"></div>
                <div class="tick vertical y3"></div>
                <div class="tick vertical y4"></div>


                <div class="levelLabel labelTop">
                    +10°
                </div>

                <div class="levelLabel labelBottom">
                    -10°
                </div>

                <div class="levelLabel labelLeft">
                    -10°
                </div>

                <div class="levelLabel labelRight">
                    +10°
                </div>


                <div class="center-dot"></div>


                <div
                    class="bubble"
                    id="bubble">
                </div>

            </div>

        </div>

    </section>


    <!-- ==============================================
         SAĞ - SOL DENGE
    =============================================== -->

    <section
        class="panel rollPanel"
        id="rollPanel">

        <div class="panelTitle">
            SAĞ - SOL DENGE
        </div>

        <div
            class="value"
            id="rollValue">

            +0<span class="unit">°</span>

        </div>

        <div class="vehicleWrap">

            <img
                id="rollImage"
                class="vehicle"
                alt="Discovery roll">

        </div>

    </section>

</div>


<script>

(async function(){


    /* ==================================================
       SERVICE WORKER / CACHE TEMİZLEME
    ================================================== */

    try{

        if(
            "serviceWorker" in navigator
        ){

            const registrations =
                await navigator
                    .serviceWorker
                    .getRegistrations();

            for(
                const registration
                of registrations
            ){

                await registration.unregister();

            }

        }


        if(
            "caches" in window
        ){

            const cacheNames =
                await caches.keys();

            for(
                const cacheName
                of cacheNames
            ){

                await caches.delete(
                    cacheName
                );

            }

        }

    }
    catch(error){

        console.log(
            "Cache temizleme:",
            error
        );

    }


    /* ==================================================
       IMAGE VERSION
    ================================================== */

    const IMAGE_VERSION =
        "20261008-15";


    const pitchImage =
        document.getElementById(
            "pitchImage"
        );

    const rollImage =
        document.getElementById(
            "rollImage"
        );


    pitchImage.src =
        "pitch_discovery.png?v=" +
        IMAGE_VERSION;

    rollImage.src =
        "roll_discovery.png?v=" +
        IMAGE_VERSION;


    /* ==================================================
       SENSOR FILTER
    ================================================== */

    const SENSOR_ALPHA =
        0.08;

    const BUBBLE_ALPHA =
        0.08;

    const VEHICLE_ALPHA =
        0.20;

    const DEAD_BAND =
        0.15;

    const MAX_ANGLE =
        10;


    /* ==================================================
       ELEMENTLER
    ================================================== */

    const pitchPanel =
        document.getElementById(
            "pitchPanel"
        );

    const rollPanel =
        document.getElementById(
            "rollPanel"
        );

    const pitchValue =
        document.getElementById(
            "pitchValue"
        );

    const rollValue =
        document.getElementById(
            "rollValue"
        );

    const bubble =
        document.getElementById(
            "bubble"
        );

    const altitudeValue =
        document.getElementById(
            "altitudeValue"
        );


    /* ==================================================
       SENSOR VARIABLES
    ================================================== */

    let filteredAx = 0;
    let filteredAy = 0;
    let filteredAz = 0;

    let sensorInitialized =
        false;

    let pitchRaw = 0;
    let rollRaw = 0;

    let bubblePitch = 0;
    let bubbleRoll = 0;

    let visualPitch = 0;
    let visualRoll = 0;


    /* ==================================================
       GPS ALTITUDE VARIABLES
    ================================================== */

    let altitudeFiltered = null;

    /*
     * GPS rakım filtresi.
     *
     * Düşük değer = daha sakin
     * Yüksek değer = daha hızlı
     */

    const ALTITUDE_ALPHA =
        0.08;


    /* ==================================================
       DEAD BAND
    ================================================== */

    function stabilize(
        value,
        previous
    ){

        if(
            Math.abs(
                value -
                previous
            ) < DEAD_BAND
        ){

            return previous;

        }

        return value;

    }


    /* ==================================================
       ANGLE CLAMP
    ================================================== */

    function clampAngle(
        value
    ){

        return Math.max(
            -MAX_ANGLE,
            Math.min(
                MAX_ANGLE,
                value
            )
        );

    }


    /* ==================================================
       DEGREE FORMAT
    ================================================== */

    function formatDegree(
        value
    ){

        const rounded =
            Math.round(
                value
            );

        if(
            rounded > 0
        ){

            return "+" +
                rounded;

        }

        return String(
            rounded
        );

    }


    /* ==================================================
       CARD LEVEL
    ================================================== */

    function updateCardLevel(
        panel,
        value
    ){

        panel.classList.remove(
            "level-0",
            "level-1",
            "level-2",
            "level-3",
            "level-4",
            "level-5"
        );


        const abs =
            Math.abs(
                value
            );


        if(
            abs <= 0.5
        ){

            panel.classList.add(
                "level-0"
            );

        }
        else if(
            abs <= 1
        ){

            panel.classList.add(
                "level-1"
            );

        }
        else if(
            abs <= 2
        ){

            panel.classList.add(
                "level-2"
            );

        }
        else if(
            abs <= 3
        ){

            panel.classList.add(
                "level-3"
            );

        }
        else if(
            abs <= 5
        ){

            panel.classList.add(
                "level-4"
            );

        }
        else{

            panel.classList.add(
                "level-5"
            );

        }

    }


    /* ==================================================
       UPDATE LEVEL
    ================================================== */

    function updateLevel(){


        const displayPitch =
            clampAngle(
                pitchRaw
            );


        const displayRoll =
            clampAngle(
                rollRaw
            );


        pitchValue.innerHTML =
            formatDegree(
                displayPitch
            ) +
            '<span class="unit">°</span>';


        rollValue.innerHTML =
            formatDegree(
                displayRoll
            ) +
            '<span class="unit">°</span>';


        updateCardLevel(
            pitchPanel,
            displayPitch
        );


        updateCardLevel(
            rollPanel,
            displayRoll
        );


        /* ==================================================
           BUBBLE
        ================================================== */

        bubblePitch +=
            (
                displayPitch -
                bubblePitch
            ) *
            BUBBLE_ALPHA;


        bubbleRoll +=
            (
                displayRoll -
                bubbleRoll
            ) *
            BUBBLE_ALPHA;


        const maxMove =
            112;


        const moveX =
            (
                bubbleRoll /
                MAX_ANGLE
            ) *
            maxMove;


        const moveY =
            (
                bubblePitch /
                MAX_ANGLE
            ) *
            maxMove;


        bubble.style.transform =
            "translate(" +
            "calc(-50% + " +
            moveX +
            "px), " +
            "calc(-50% + " +
            moveY +
            "px)" +
            ")";


        /* ==================================================
           VEHICLE
        ================================================== */

        visualPitch +=
            (
                displayPitch -
                visualPitch
            ) *
            VEHICLE_ALPHA;


        visualRoll +=
            (
                displayRoll -
                visualRoll
            ) *
            VEHICLE_ALPHA;


        pitchImage.style.transform =
            "rotate(" +
            clampAngle(
                visualPitch
            ) +
            "deg)";


        rollImage.style.transform =
            "rotate(" +
            clampAngle(
                visualRoll
            ) +
            "deg)";


        requestAnimationFrame(
            updateLevel
        );

    }


    /* ==================================================
       DEVICE MOTION
    ================================================== */

    function handleMotion(
        event
    ){

        const acceleration =
            event.accelerationIncludingGravity;


        if(
            !acceleration
        ){

            return;

        }


        let ax =
            Number(
                acceleration.x
            ) || 0;


        let ay =
            Number(
                acceleration.y
            ) || 0;


        let az =
            Number(
                acceleration.z
            ) || 0;


        if(
            !sensorInitialized
        ){

            filteredAx =
                ax;

            filteredAy =
                ay;

            filteredAz =
                az;

            sensorInitialized =
                true;

        }
        else{

            filteredAx +=
                (
                    ax -
                    filteredAx
                ) *
                SENSOR_ALPHA;


            filteredAy +=
                (
                    ay -
                    filteredAy
                ) *
                SENSOR_ALPHA;


            filteredAz +=
                (
                    az -
                    filteredAz
                ) *
                SENSOR_ALPHA;

        }


        /* ==================================================
           PITCH
        ================================================== */

        const newPitch =
            Math.atan2(
                filteredAz,
                Math.sqrt(
                    filteredAx *
                    filteredAx +
                    filteredAy *
                    filteredAy
                )
            ) *
            180 /
            Math.PI;


        /* ==================================================
           ROLL
        ================================================== */

        const newRoll =
            Math.atan2(
                filteredAx,
                Math.sqrt(
                    filteredAy *
                    filteredAy +
                    filteredAz *
                    filteredAz
                )
            ) *
            180 /
            Math.PI;


        pitchRaw =
            stabilize(
                newPitch,
                pitchRaw
            );


        rollRaw =
            stabilize(
                newRoll,
                rollRaw
            );

    }


    /* ==================================================
       GPS ALTITUDE
    ================================================== */

    function startAltitude(){

        if(
            !("geolocation" in navigator)
        ){

            altitudeValue.textContent =
                "-- m";

            return;

        }


        navigator.geolocation.watchPosition(

            function(position){

                const altitude =
                    position.coords.altitude;


                /*
                 * Bazı cihazlarda GPS rakımı
                 * null gelebilir.
                 */

                if(
                    altitude === null ||
                    !Number.isFinite(
                        altitude
                    )
                ){

                    altitudeValue.textContent =
                        "-- m";

                    return;

                }


                /*
                 * İlk değer.
                 */

                if(
                    altitudeFiltered === null
                ){

                    altitudeFiltered =
                        altitude;

                }
                else{

                    /*
                     * Rakım filtresi.
                     */

                    altitudeFiltered +=
                        (
                            altitude -
                            altitudeFiltered
                        ) *
                        ALTITUDE_ALPHA;

                }


                /*
                 * Tam metre olarak göster.
                 */

                altitudeValue.textContent =
                    Math.round(
                        altitudeFiltered
                    ) +
                    " m";

            },

            function(error){

                console.log(
                    "GPS altitude:",
                    error
                );

                altitudeValue.textContent =
                    "-- m";

            },

            {
                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );

    }


    /* ==================================================
       START SENSOR
    ================================================== */

    async function startSensor(){

        try{


            /* ==============================================
               MOTION PERMISSION
            ============================================== */

            if(
                typeof DeviceMotionEvent !==
                "undefined" &&

                typeof DeviceMotionEvent
                    .requestPermission ===
                "function"
            ){

                const permission =
                    await DeviceMotionEvent
                        .requestPermission();


                if(
                    permission !==
                    "granted"
                ){

                    alert(
                        "Hareket sensörü izni verilmedi."
                    );

                    return;

                }

            }


            /* ==============================================
               MOTION LISTENER
            ============================================== */

            window.addEventListener(
                "devicemotion",
                handleMotion,
                {
                    passive:true
                }
            );


            /* ==============================================
               GPS
            ============================================== */

            startAltitude();


            /* ==============================================
               START SCREEN
            ============================================== */

            const startScreen =
                document.querySelector(
                    ".startScreen"
                );


            if(
                startScreen
            ){

                startScreen.remove();

            }

        }
        catch(error){

            console.error(
                error
            );


            alert(
                "Sensörler başlatılamadı."
            );

        }

    }


    /* ==================================================
       START SCREEN
    ================================================== */

    const startScreen =
        document.createElement(
            "div"
        );


    startScreen.className =
        "startScreen";


    startScreen.innerHTML = `
        <button
            class="startButton"
            id="startButton">
            ÖLÇÜMÜ BAŞLAT
        </button>
    `;


    document.body.appendChild(
        startScreen
    );


    document
        .getElementById(
            "startButton"
        )
        .addEventListener(
            "click",
            startSensor
        );


    /* ==================================================
       START LEVEL LOOP
    ================================================== */

    requestAnimationFrame(
        updateLevel
    );


})();

</script>
