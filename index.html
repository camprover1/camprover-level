<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta

>

<meta
  http-equiv="Cache-Control"
  content="no-cache,no-store,must-revalidate"
>

<meta
  http-equiv="Pragma"
  content="no-cache"

  content="0"

<title>Camprover Level</title>


<style>

/* ================================================= */
/* TEMEL RENKLER */
/* ================================================= */

:root{

  --bg:#080b0f;

  --panel:#11161c;

  --panel2:#151b22;

  --border:#27313a;

  --text:#f2f5f7;

  --muted:#7e8993;

  /* MAVİ TONU */
  --level-blue:#00A8FF;

  --green:#20e890;

  --red:#ff4d5e;

}


/* ================================================= */
/* RESET */
/* ================================================= */

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}


html,
body{

  width:100%;

  height:100%;

  margin:0;

  padding:0;

  overflow:hidden;

  background:var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

}


body{

  display:flex;

  align-items:center;

  justify-content:center;

}


/* ================================================= */
/* ANA UYGULAMA */
/* ================================================= */

.app{

  width:min(1400px,100vw);

  height:100vh;

  min-height:0;

  padding:18px;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


/* ================================================= */
/* HEADER */
/* ================================================= */

.header{

  flex-shrink:0;

  text-align:center;

  margin-bottom:15px;

}


.header h1{

  margin:0;

  font-size:25px;

  font-weight:700;

  letter-spacing:4px;

}


.header p{

  margin:5px 0 0;

  color:var(--muted);

  font-size:11px;

  letter-spacing:2px;

}


/* ================================================= */
/* DASHBOARD */
/* ================================================= */

.dashboard{

  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(230px,1fr)
    minmax(420px,1.5fr)
    minmax(230px,1fr);

  gap:20px;

  align-items:stretch;

}


/* ================================================= */
/* KARTLAR */
/* ================================================= */

.card{

  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.005)
    ),
    var(--panel);

  border:4px solid var(--border);

  border-radius:22px;

  padding:20px;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  transition:
    border-color .35s ease,
    box-shadow .35s ease;

}


.card-title{

  color:var(--muted);

  font-size:12px;

  font-weight:700;

  letter-spacing:3px;

  text-align:center;

}


.value{

  text-align:center;

  font-size:46px;

  font-weight:700;

  line-height:1;

  margin-top:16px;

  font-variant-numeric:tabular-nums;

}


/* ================================================= */
/* MAVİ SEVİYE ÇERÇEVESİ */
/* ================================================= */

.card.level-0{

  border-color:var(--level-blue);

  box-shadow:

    0 0 5px var(--level-blue),

    0 0 15px rgba(0,168,255,.45),

    inset 0 0 15px rgba(0,168,255,.08);

}


.card.level-1{

  border-color:rgba(0,168,255,.78);

  box-shadow:
    0 0 8px rgba(0,168,255,.35);

}


.card.level-2{

  border-color:rgba(0,168,255,.58);

}


.card.level-3{

  border-color:rgba(0,168,255,.40);

}


.card.level-4{

  border-color:rgba(0,168,255,.22);

}


.card.level-5{

  border-color:var(--border);

  box-shadow:none;

}


/* ================================================= */
/* ARAÇ GÖRSELLERİ */
/* ================================================= */

.vehicle-area{

  flex:1;

  min-height:0;

  margin-top:15px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.vehicle-area img{

  width:92%;

  max-width:380px;

  height:auto;

  object-fit:contain;

  transition:none;

  will-change:transform;

}


/* ================================================= */
/* MERKEZ PANEL */
/* ================================================= */

.center-panel{

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:0;

}


/* ================================================= */
/* YUVARLAK TERAZİ */
/* ================================================= */

.level{

  position:relative;

  width:min(440px,80vw);

  height:min(440px,80vw);

  max-width:100%;

  max-height:100%;

  border-radius:50%;

  background:

    radial-gradient(
      circle at center,
      #151d24 0%,
      #0e141a 65%,
      #090d11 100%
    );

  border:2px solid #26313a;

  box-shadow:

    inset 0 0 35px rgba(0,0,0,.8),

    0 15px 35px rgba(0,0,0,.35);

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


/* ================================================= */
/* TERAZİ ÇİZGİLERİ */
/* ================================================= */

.level::before{

  content:"";

  position:absolute;

  left:8%;

  right:8%;

  top:50%;

  height:1px;

  background:rgba(255,255,255,.10);

  transform:translateY(-50%);

}


.level::after{

  content:"";

  position:absolute;

  top:8%;

  bottom:8%;

  left:50%;

  width:1px;

  background:rgba(255,255,255,.10);

  transform:translateX(-50%);

}


/* ================================================= */
/* MERKEZ DISCOVERY */
/* ================================================= */

.center-car{

  position:absolute;

  width:52%;

  height:auto;

  object-fit:contain;

  pointer-events:none;

  z-index:4;

  opacity:.95;

}


/* ================================================= */
/* YEŞİL YATAY SU TERAZİSİ */
/* ================================================= */

.gravity-level{

  position:absolute;

  left:50%;

  bottom:8%;

  transform:translateX(-50%);

  width:72%;

  z-index:15;

}


/* ================================================= */
/* DERECE ÖLÇEĞİ */
/* ================================================= */

.gravity-scale{

  display:flex;

  justify-content:space-between;

  align-items:center;

  width:100%;

  margin-bottom:5px;

  padding:0 2px;

  color:var(--green);

  font-size:7px;

  font-weight:600;

  letter-spacing:.5px;

}


/* ================================================= */
/* SU TERAZİSİ DIŞ TÜP */
/* ================================================= */

.spirit-level{

  width:100%;

  height:34px;

  padding:4px;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      #183c2d,
      #07150e
    );

  border:2px solid var(--green);

  box-shadow:

    0 0 8px rgba(32,232,144,.65),

    inset 0 0 8px rgba(32,232,144,.25);

}


/* ================================================= */
/* SU TERAZİSİ İÇ TÜP */
/* ================================================= */

.level-tube{

  position:relative;

  width:100%;

  height:100%;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      rgba(32,232,144,.20),
      rgba(32,232,144,.05)
    );

  overflow:hidden;

}


/* ================================================= */
/* ORTA REFERANS ÇİZGİSİ */
/* ================================================= */

.level-tube::before{

  content:"";

  position:absolute;

  left:50%;

  top:0;

  bottom:0;

  width:2px;

  background:var(--green);

  opacity:.8;

  transform:translateX(-50%);

}


/* ================================================= */
/* SU TERAZİSİ BALONU */
/* ================================================= */

.level-bubble{

  position:absolute;

  left:50%;

  top:50%;

  width:22px;

  height:22px;

  border-radius:50%;

  background:

    radial-gradient(
      circle at 35% 30%,
      #ffffff,
      #50ffad 25%,
      #20e890 60%,
      #08784b 100%
    );

  box-shadow:

    0 0 8px var(--green),

    0 0 18px rgba(32,232,144,.55),

    inset 0 0 5px rgba(255,255,255,.5);

  transform:
    translate(-50%,-50%);

  will-change:transform;

}


/* ================================================= */
/* RESET BUTONU */
/* ================================================= */

.zero-button{

  position:absolute;

  left:
    calc(
      50%
      - min(440px,80vw)/2
      - 38px
    );

  top:50%;

  transform:translateY(-50%);

  width:32px;

  height:32px;

  padding:0;

  border-radius:50%;

  border:2px solid #27313a;

  background:#111820;

  color:#8d99a3;

  font-size:19px;

  line-height:28px;

  cursor:pointer;

  outline:none;

  z-index:30;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:

    border-color .25s ease,

    box-shadow .25s ease,

    color .25s ease,

    background .25s ease,

    transform .15s ease;

}


.zero-button:active{

  transform:
    translateY(-50%)
    scale(.90);

}


.zero-button.active{

  border-color:var(--level-blue);

  color:#ffffff;

  background:#0c1720;

  box-shadow:

    0 0 5px var(--level-blue),

    0 0 12px rgba(0,168,255,.55),

    0 0 20px rgba(0,168,255,.22);

}


/* ================================================= */
/* FOOTER */
/* ================================================= */

.footer{

  flex-shrink:0;

  text-align:center;

  margin-top:10px;

  color:#53606b;

  font-size:9px;

  letter-spacing:1px;

}

/* MOBİL */
/* ================================================= */

<script>


/* ================================================= */
/* SERVICE WORKER / CACHE TEMİZLEME */
/* ================================================= */

(async function(){

  try{

    if(
      "serviceWorker" in navigator
    ){

      const registrations =
        await navigator
        .serviceWorker
        .getRegistrations();


      for(
        const registration
        of registrations
      ){

        await registration.unregister();

      }

    }


    if(
      "caches" in window
    ){

      const keys =
        await caches.keys();


      for(
        const key
        of keys
      ){

        await caches.delete(key);

      }

    }

  }

  catch(e){

    console.log(
      "Cache temizleme:",
      e
    );

  }

})();

/* ================================================= */
/* KART SEVİYESİ */
/* ================================================= */

function updateCardLevel(
  card,
  value
){

  card.classList.remove(

    "level-0",
    "level-1",
    "level-2",
    "level-3",
    "level-4",
    "level-5"

  );


  const absValue =
    Math.abs(value);


  if(
    absValue <= 0.5
  ){

    card.classList.add(
      "level-0"
    );

  }

  else if(
    absValue <= 1
  ){

    card.classList.add(
      "level-1"
    );

  }

  else if(
    absValue <= 2
  ){

    card.classList.add(
      "level-2"
    );

  }

  else if(
    absValue <= 3
  ){

    card.classList.add(
      "level-3"
    );

  }

  else if(
    absValue <= 5
  ){

    card.classList.add(
      "level-4"
    );

  }

  else{

    card.classList.add(
      "level-5"
    );

  }

}



/* ================================================= */
/* DERECE FORMAT */
/* ================================================= */

function formatDegree(
  value
){

  const rounded =
    Math.round(value);


  if(
    rounded > 0
  ){

    return "+" +
      rounded +
      "°";

  }


  return rounded +
    "°";

}



/* ================================================= */
/* DEĞERİ ±10° ARALIĞINA SINIRLA */
/* ================================================= */

function clampAngle(
  value
){

  return Math.max(

    -MAX_ANGLE,

    Math.min(
      MAX_ANGLE,
      value
    )

  );

}



/* ================================================= */
/* ANA GÜNCELLEME */
/* ================================================= */

function updateLevel(){


  /* ================================================= */
  /* GÖSTERİLECEK DEĞERLER */
/* ================================================= */

  let displayPitch =
    pitchRaw;


  let displayRoll =
    rollRaw;



  /* ================================================= */
  /* RESET */
/* ================================================= */

  if(
    zeroActive
  ){

    displayPitch =
      pitchRaw -
      zeroPitch;


    displayRoll =
      rollRaw -
      zeroRoll;

  }



  /* ================================================= */
  /* ±10° SINIR */
/* ================================================= */

  displayPitch =
    clampAngle(
      displayPitch
    );


  displayRoll =
    clampAngle(
      displayRoll
    );



  /* ================================================= */
  /* SAYISAL DEĞERLER */
/* ================================================= */

  pitchValue.textContent =
    formatDegree(
      displayPitch
    );


  rollValue.textContent =
    formatDegree(
      displayRoll
    );



  /* ================================================= */
  /* KART ÇERÇEVESİ */
/* ================================================= */

  updateCardLevel(
    pitchCard,
    displayPitch
  );


  updateCardLevel(
    rollCard,
    displayRoll
  );



  /* ================================================= */
  /* SU TERAZİSİ FİLTRESİ */
/* ================================================= */

  bubblePitch +=
    (
      displayPitch -
      bubblePitch
    ) *
    BUBBLE_ALPHA;


  bubbleRoll +=
    (
      displayRoll -
      bubbleRoll
    ) *
    BUBBLE_ALPHA;



  /* ================================================= */
  /* YEŞİL SU TERAZİSİ */
/* ================================================= */

  /*
    Su terazisi Roll eksenini gösteriyor.

    -10° = sol uç
     0°  = orta
    +10° = sağ uç
  */

  const gravityMaxMove =
    42;


  const gravityMove =
    (
      bubbleRoll /
      MAX_ANGLE
    ) *
    gravityMaxMove;


  gravityBubble.style.transform =
    `translate(
      calc(-50% + ${gravityMove}px),
      -50%
    )`;



  /* ================================================= */
  /* ARAÇ GÖRSELİ FİLTRESİ */
/* ================================================= */

  visualPitch +=
    (
      displayPitch -
      visualPitch
    ) *
    VEHICLE_ALPHA;


  visualRoll +=
    (
      displayRoll -
      visualRoll
    ) *
    VEHICLE_ALPHA;



  /* ================================================= */
  /* PITCH GÖRSELİ */
/* ================================================= */

  const pitchAngle =
    clampAngle(
      visualPitch
    );


  pitchImage.style.transform =
    `rotate(${pitchAngle}deg)`;



  /* ================================================= */
  /* ROLL GÖRSELİ */
/* ================================================= */

  const rollAngle =
    clampAngle(
      visualRoll
    );


  rollImage.style.transform =
    `rotate(${rollAngle}deg)`;

}



/* ================================================= */
/* SENSOR OKUMA */
/* ================================================= */

function handleMotion(
  event
){

  if(
    !event.accelerationIncludingGravity
  ){

    return;

  }


  const a =
    event.accelerationIncludingGravity;


  const ax =
    a.x || 0;


  const ay =
    a.y || 0;


  const az =
    a.z || 0;



  /* ================================================= */
  /* SENSOR FİLTRESİ */
/* ================================================= */

  if(
    firstSensorReading
  ){

    filteredAx =
      ax;


    filteredAy =
      ay;


    filteredAz =
      az;


    firstSensorReading =
      false;

  }

  else{

    filteredAx +=
      (
        ax -
        filteredAx
      ) *
      SENSOR_ALPHA;


    filteredAy +=
      (
        ay -
        filteredAy
      ) *
      SENSOR_ALPHA;


    filteredAz +=
      (
        az -
        filteredAz
      ) *
      SENSOR_ALPHA;

  }



  /* ================================================= */
  /* PITCH */
/* ================================================= */

  pitchRaw =

    Math.atan2(

      filteredAz,

      Math.sqrt(

        filteredAx *
        filteredAx +

        filteredAy *
        filteredAy

      )

    )

    *

    180 /

    Math.PI;



  /* ================================================= */
  /* ROLL */
/* ================================================= */

  rollRaw =

    Math.atan2(

      filteredAx,

      Math.sqrt(

        filteredAy *
        filteredAy +

        filteredAz *
        filteredAz

      )

    )

    *

    180 /

    Math.PI;



  updateLevel();

}



/* ================================================= */
/* SENSOR BAŞLAT */
/* ================================================= */

async function startSensor(){

  try{


    if(

      typeof DeviceMotionEvent !==
      "undefined"

      &&

      typeof DeviceMotionEvent.requestPermission ===
      "function"

    ){

      const permission =

        await
        DeviceMotionEvent
        .requestPermission();


      if(
        permission !==
        "granted"
      ){

        alert(
          "Hareket sensörü izni verilmedi."
        );

        return;

      }

    }



    window.addEventListener(

      "devicemotion",

      handleMotion,

      true

    );



    const startScreen =
      document.getElementById(
        "startScreen"
      );


    if(
      startScreen
    ){

      startScreen.remove();

    }

  }

  catch(error){

    console.error(
      error
    );


    alert(
      "Sensör başlatılamadı."
    );

  }

}

zeroButton.addEventListener(

  "click",

  function(){


    /* ================================================= */
    /* İLK BASIŞ */
/* ================================================= */

    if(
      !zeroActive
    ){

      zeroPitch =
        pitchRaw;


      zeroRoll =
        rollRaw;


      zeroActive =
        true;


      bubblePitch =
        0;


      bubbleRoll =
        0;


      visualPitch =
        0;


      visualRoll =
        0;


      zeroButton
        .classList
        .add(
          "active"
        );


      zeroButton
        .setAttribute(
          "aria-label",
          "Sıfırlamayı iptal et"
        );


      zeroButton.title =
        "Yerçekimi referansına dön";


      updateLevel();

    }


    /* ================================================= */
    /* İKİNCİ BASIŞ */
/* ================================================= */

    else{

      zeroActive =
        false;


      zeroPitch =
        0;


      zeroRoll =
        0;


      bubblePitch =
        0;


      bubbleRoll =
        0;


      visualPitch =
        0;


      visualRoll =
        0;


      zeroButton
        .classList
        .remove(
          "active"
        );


      zeroButton
        .setAttribute(
          "aria-label",
          "Ölçümü sıfırla"
        );


      zeroButton.title =
        "Ölçümü sıfırla";


      updateLevel();

    }

  }

);
