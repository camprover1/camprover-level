<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Camprover Level</title>

<style>

/* ================================================= */
/* RENKLER */
/* ================================================= */

:root{

  --bg:#080b0f;

  --panel:#11161c;

  --border:#27313a;

  --text:#f2f5f7;

  --muted:#7e8993;

  /* MAVİ TONU */
  --level-blue:#00A8FF;

  /* YEŞİL SIVI */
  --green:#20e890;

}


/* ================================================= */
/* RESET */
/* ================================================= */

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}


html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

}


body{

  display:flex;

  align-items:center;
  justify-content:center;

}


/* ================================================= */
/* ANA UYGULAMA */
/* ================================================= */

.app{

  width:min(1400px,100vw);

  height:100vh;

  padding:18px;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


/* ================================================= */
/* HEADER */
/* ================================================= */

.header{

  flex-shrink:0;

  text-align:center;

  margin-bottom:15px;

}


.header h1{

  margin:0;

  font-size:25px;

  font-weight:700;

  letter-spacing:4px;

}


.header p{

  margin:5px 0 0;

  color:var(--muted);

  font-size:11px;

  letter-spacing:2px;

}


/* ================================================= */
/* DASHBOARD */
/* ================================================= */

.dashboard{

  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(230px,1fr)
    minmax(420px,1.5fr)
    minmax(230px,1fr);

  gap:20px;

  align-items:stretch;

}


/* ================================================= */
/* KARTLAR */
/* ================================================= */

.card{

  position:relative;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.005)
    ),

    var(--panel);

  border:4px solid var(--border);

  border-radius:22px;

  padding:20px;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  transition:

    border-color .35s ease,

    box-shadow .35s ease;

}


.card-title{

  color:var(--muted);

  font-size:12px;

  font-weight:700;

  letter-spacing:3px;

  text-align:center;

}


.value{

  text-align:center;

  font-size:46px;

  font-weight:700;

  line-height:1;

  margin-top:16px;

  font-variant-numeric:tabular-nums;

}


/* ================================================= */
/* MAVİ ÇERÇEVE SEVİYELERİ */
/* ================================================= */

.card.level-0{

  border-color:var(--level-blue);

  box-shadow:

    0 0 5px var(--level-blue),

    0 0 15px rgba(0,168,255,.45),

    inset 0 0 15px rgba(0,168,255,.08);

}


.card.level-1{

  border-color:rgba(0,168,255,.78);

  box-shadow:

    0 0 8px rgba(0,168,255,.35);

}


.card.level-2{

  border-color:rgba(0,168,255,.58);

}


.card.level-3{

  border-color:rgba(0,168,255,.40);

}


.card.level-4{

  border-color:rgba(0,168,255,.22);

}


.card.level-5{

  border-color:var(--border);

  box-shadow:none;

}


/* ================================================= */
/* ARAÇ GÖRSELLERİ */
/* ================================================= */

.vehicle-area{

  flex:1;

  min-height:0;

  margin-top:15px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.vehicle-area img{

  width:92%;

  max-width:380px;

  height:auto;

  object-fit:contain;

  transition:none;

  will-change:transform;

}


/* ================================================= */
/* MERKEZ PANEL */
/* ================================================= */

.center-panel{

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:0;

}


/* ================================================= */
/* DAİRESEL TERAZİ */
/* ================================================= */

.level{

  position:relative;

  width:min(440px,80vw);

  height:min(440px,80vw);

  max-width:100%;

  max-height:100%;

  border-radius:50%;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(35,75,58,.55) 0%,
      rgba(11,31,23,.80) 48%,
      rgba(4,12,9,.96) 100%
    );

  border:

    3px solid
    rgba(32,232,144,.55);

  box-shadow:

    inset 0 0 45px rgba(0,0,0,.9),

    inset 0 0 25px rgba(32,232,144,.08),

    0 0 20px rgba(32,232,144,.10);

}


/* ================================================= */
/* YEŞİL SIVI ALANI */
/* ================================================= */

.liquid{

  position:absolute;

  inset:8%;

  border-radius:50%;

  overflow:hidden;

  background:

    radial-gradient(
      ellipse at 50% 50%,
      rgba(32,232,144,.18),
      rgba(11,60,39,.34) 48%,
      rgba(3,18,12,.60) 100%
    );

  border:

    2px solid
    rgba(32,232,144,.42);

  box-shadow:

    inset 0 0 30px rgba(32,232,144,.12),

    inset 0 0 50px rgba(0,0,0,.65);

}


/* ================================================= */
/* SIVI PARLAKLIK */
/* ================================================= */

.liquid::before{

  content:"";

  position:absolute;

  width:150%;

  height:55%;

  left:-25%;

  top:23%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(42,255,160,.20),
      rgba(32,232,144,.06) 55%,
      transparent 75%
    );

  filter:blur(2px);

}


/* ================================================= */
/* YATAY EKSEN */
/* ================================================= */

.axis-horizontal{

  position:absolute;

  left:7%;

  right:7%;

  top:50%;

  height:1px;

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(32,232,144,.45),
      transparent
    );

  transform:translateY(-50%);

}


/* ================================================= */
/* DİKEY EKSEN */
/* ================================================= */

.axis-vertical{

  position:absolute;

  top:7%;

  bottom:7%;

  left:50%;

  width:1px;

  background:

    linear-gradient(
      180deg,
      transparent,
      rgba(32,232,144,.45),
      transparent
    );

  transform:translateX(-50%);

}


/* ================================================= */
/* 10 DERECE İŞARETLERİ */
/* ================================================= */

.mark{

  position:absolute;

  background:rgba(32,232,144,.38);

}


.mark.top,
.mark.bottom{

  width:2px;

  height:12px;

  left:50%;

  transform:translateX(-50%);

}


.mark.left,
.mark.right{

  width:12px;

  height:2px;

  top:50%;

  transform:translateY(-50%);

}


.mark.top{

  top:7%;

}


.mark.bottom{

  bottom:7%;

}


.mark.left{

  left:7%;

}


.mark.right{

  right:7%;

}


/* ================================================= */
/* 5 DERECE İŞARETLERİ */
/* ================================================= */

.mark.top5,
.mark.bottom5{

  width:1px;

  height:7px;

  left:50%;

  background:rgba(32,232,144,.25);

  transform:translateX(-50%);

}


.mark.left5,
.mark.right5{

  width:7px;

  height:1px;

  top:50%;

  background:rgba(32,232,144,.25);

  transform:translateY(-50%);

}


.mark.top5{

  top:17%;

}


.mark.bottom5{

  bottom:17%;

}


.mark.left5{

  left:17%;

}


.mark.right5{

  right:17%;

}


/* ================================================= */
/* DERECE YAZILARI */
/* ================================================= */

.angle-label{

  position:absolute;

  color:rgba(32,232,144,.48);

  font-size:8px;

  font-weight:600;

  letter-spacing:.5px;

  z-index:5;

}


.angle-top{

  top:3.5%;

  left:50%;

  transform:translateX(-50%);

}


.angle-bottom{

  bottom:3.5%;

  left:50%;

  transform:translateX(-50%);

}


.angle-left{

  left:3.5%;

  top:50%;

  transform:translateY(-50%);

}


.angle-right{

  right:3.5%;

  top:50%;

  transform:translateY(-50%);

}


/* ================================================= */
/* MERKEZ REFERANS NOKTASI */
/* ================================================= */

.center-dot{

  position:absolute;

  left:50%;

  top:50%;

  width:5px;

  height:5px;

  border-radius:50%;

  background:var(--green);

  box-shadow:

    0 0 7px var(--green),

    0 0 14px rgba(32,232,144,.55);

  transform:translate(-50%,-50%);

  z-index:8;

}


/* ================================================= */
/* HAREKETLİ KABARCIK */
/* ================================================= */

.bubble{

  position:absolute;

  left:50%;

  top:50%;

  width:54px;

  height:54px;

  border-radius:50%;

  z-index:10;

  pointer-events:none;

  transform:
    translate(-50%,-50%);

  will-change:transform;

  background:

    radial-gradient(
      circle at 32% 27%,
      rgba(255,255,255,.95) 0%,
      rgba(130,255,198,.95) 8%,
      rgba(32,232,144,.95) 30%,
      rgba(14,160,94,.92) 62%,
      rgba(4,78,45,.85) 100%
    );

  border:

    2px solid
    rgba(113,255,194,.95);

  box-shadow:

    0 0 8px rgba(32,232,144,.95),

    0 0 22px rgba(32,232,144,.70),

    0 0 45px rgba(32,232,144,.25),

    inset 0 0 9px rgba(255,255,255,.35);

}


.bubble::after{

  content:"";

  position:absolute;

  width:13px;

  height:8px;

  left:11px;

  top:9px;

  border-radius:50%;

  background:rgba(255,255,255,.65);

  filter:blur(1px);

}


/* ================================================= */
/* FOOTER */
/* ================================================= */

.footer{

  flex-shrink:0;

  text-align:center;

  margin-top:10px;

  color:#53606b;

  font-size:9px;

  letter-spacing:1px;

}


/* ================================================= */
/* MOBİL */
/* ================================================= */

@media(max-width:900px){

  html,
  body{

    width:100%;
    height:100%;

    overflow:hidden;

  }


  body{

    display:block;

  }


  .app{

    width:100%;

    height:100dvh;

    min-height:0;

    padding:

      env(safe-area-inset-top)

      7px

      env(safe-area-inset-bottom)

      7px;

    display:flex;

    flex-direction:column;

    overflow:hidden;

  }


  .header{

    flex:0 0 auto;

    margin:4px 0 6px;

  }


  .header h1{

    font-size:15px;

    letter-spacing:2px;

  }


  .header p{

    margin-top:2px;

    font-size:7px;

  }


  /* ================================================= */
  /* MOBİL GRID */
/* ================================================= */

  .dashboard{

    flex:1;

    min-height:0;

    width:100%;

    display:grid;

    grid-template-columns:

      1fr 1fr;

    grid-template-rows:

      minmax(285px,1.30fr)

      minmax(0,1fr);

    gap:7px;

    overflow:hidden;

  }


  /* ================================================= */
  /* MERKEZ */
/* ================================================= */

  .center-panel{

    grid-column:1 / 3;

    grid-row:1;

    min-width:0;

    min-height:0;

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:visible;

  }


  .center-panel .level{

    width:min(78vw,360px);

    height:min(78vw,360px);

    max-width:90%;

    max-height:90%;

    flex-shrink:0;

  }


  .bubble{

    width:44px;

    height:44px;

  }


  /* ================================================= */
  /* PITCH */
/* ================================================= */

  .card:first-child{

    grid-column:1;

    grid-row:2;

    min-width:0;

    min-height:0;

    width:100%;

    height:100%;

    padding:7px;

    border-radius:16px;

    overflow:hidden;

  }


  /* ================================================= */
  /* ROLL */
/* ================================================= */

  .card:last-child{

    grid-column:2;

    grid-row:2;

    min-width:0;

    min-height:0;

    width:100%;

    height:100%;

    padding:7px;

    border-radius:16px;

    overflow:hidden;

  }


  .card-title{

    font-size:9px;

    letter-spacing:2px;

  }


  .value{

    font-size:28px;

    margin-top:7px;

    flex-shrink:0;

  }


  /* ================================================= */
  /* ARAÇ GÖRSELLERİ */
/* ================================================= */

  .card:first-child .vehicle-area,
  .card:last-child .vehicle-area{

    flex:1;

    min-height:0;

    margin-top:3px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

  }


  .card:first-child .vehicle-area img,
  .card:last-child .vehicle-area img{

    width:94%;

    max-width:none;

    height:auto;

    margin:0;

  }


  .footer{

    display:none;

  }

}


/* ================================================= */
/* KÜÇÜK TELEFON */
/* ================================================= */

@media(max-width:430px){

  .app{

    padding:

      env(safe-area-inset-top)

      5px

      env(safe-area-inset-bottom)

      5px;

  }


  .header{

    margin-top:2px;

    margin-bottom:4px;

  }


  .header h1{

    font-size:14px;

    letter-spacing:1.8px;

  }


  .header p{

    font-size:7px;

    letter-spacing:1px;

  }


  .dashboard{

    grid-template-rows:

      minmax(275px,1.25fr)

      minmax(0,1fr);

    gap:5px;

  }


  .center-panel .level{

    width:min(78vw,340px);

    height:min(78vw,340px);

  }


  .bubble{

    width:40px;

    height:40px;

  }


  .card:first-child,
  .card:last-child{

    padding:6px;

    border-radius:14px;

    border-width:3px;

  }


  .card-title{

    font-size:8px;

    letter-spacing:1.5px;

  }


  .value{

    font-size:25px;

    margin-top:5px;

  }


  .card:first-child .vehicle-area img,
  .card:last-child .vehicle-area img{

    width:96%;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div class="header">

    <h1>
      CAMPROVER LEVEL
    </h1>

    <p>
      LAND ROVER DISCOVERY 2 • EĞİM ÖLÇER
    </p>

  </div>


  <!-- ================================================= -->
  <!-- DASHBOARD -->
  <!-- ================================================= -->

  <div class="dashboard">


    <!-- ================================================= -->
    <!-- PITCH -->
    <!-- ================================================= -->

    <div
      id="pitchCard"
      class="card level-5"
    >

      <div class="card-title">
        PITCH
      </div>


      <div
        id="pitchValue"
        class="value"
      >
        +0°
      </div>


      <div class="vehicle-area">

        <img
          id="pitchImage"
          alt="Discovery 2 Pitch"
        >

      </div>

    </div>


    <!-- ================================================= -->
    <!-- MERKEZ DAİRESEL SU TERAZİSİ -->
    <!-- ================================================= -->

    <div class="center-panel">


      <div
        id="level"
        class="level"
      >


        <!-- YEŞİL SIVI -->

        <div class="liquid">


          <!-- EKSENLER -->

          <div class="axis-horizontal"></div>

          <div class="axis-vertical"></div>


          <!-- 10 DERECE İŞARETLERİ -->

          <div class="mark top"></div>

          <div class="mark bottom"></div>

          <div class="mark left"></div>

          <div class="mark right"></div>


          <!-- 5 DERECE İŞARETLERİ -->

          <div class="mark top5"></div>

          <div class="mark bottom5"></div>

          <div class="mark left5"></div>

          <div class="mark right5"></div>


          <!-- DERECE YAZILARI -->

          <div class="angle-label angle-top">
            +10°
          </div>

          <div class="angle-label angle-bottom">
            -10°
          </div>

          <div class="angle-label angle-left">
            -10°
          </div>

          <div class="angle-label angle-right">
            +10°
          </div>


        </div>


        <!-- MERKEZ NOKTASI -->

        <div class="center-dot"></div>


        <!-- HAREKETLİ KABARCIK -->

        <div
          id="bubble"
          class="bubble"
        ></div>


      </div>


    </div>


    <!-- ================================================= -->
    <!-- ROLL -->
    <!-- ================================================= -->

    <div
      id="rollCard"
      class="card level-5"
    >

      <div class="card-title">
        ROLL
      </div>


      <div
        id="rollValue"
        class="value"
      >
        +0°
      </div>


      <div class="vehicle-area">

        <img
          id="rollImage"
          alt="Discovery 2 Roll"
        >

      </div>

    </div>


  </div>


  <div class="footer">
    CAMPROVER • SENSOR BASED VEHICLE LEVEL
  </div>


</div>



<script>


/* ================================================= */
/* SERVICE WORKER / CACHE TEMİZLEME */
/* ================================================= */

(async function(){

  try{

    if(
      "serviceWorker" in navigator
    ){

      const registrations =
        await navigator
        .serviceWorker
        .getRegistrations();


      for(
        const registration
        of registrations
      ){

        await registration.unregister();

      }

    }


    if(
      "caches" in window
    ){

      const keys =
        await caches.keys();


      for(
        const key
        of keys
      ){

        await caches.delete(key);

      }

    }

  }

  catch(e){

    console.log(
      "Cache temizleme:",
      e
    );

  }

})();



/* ================================================= */
/* GÖRSEL VERSİYONU */
/* ================================================= */

const IMAGE_VERSION =
  "20261008-12";



/* ================================================= */
/* GÖRSELLER */
/* ================================================= */

const pitchImage =
  document.getElementById(
    "pitchImage"
  );


const rollImage =
  document.getElementById(
    "rollImage"
  );


pitchImage.src =
  "pitch_discovery.png?v=" +
  IMAGE_VERSION;


rollImage.src =
  "roll_discovery.png?v=" +
  IMAGE_VERSION;



/* ================================================= */
/* ELEMENTLER */
/* ================================================= */

const pitchValue =
  document.getElementById(
    "pitchValue"
  );


const rollValue =
  document.getElementById(
    "rollValue"
  );


const pitchCard =
  document.getElementById(
    "pitchCard"
  );


const rollCard =
  document.getElementById(
    "rollCard"
  );


const bubble =
  document.getElementById(
    "bubble"
  );



/* ================================================= */
/* FİLTRELER */
/* ================================================= */

const SENSOR_ALPHA =
  0.15;


const BUBBLE_ALPHA =
  0.15;


const VEHICLE_ALPHA =
  0.28;



/* ================================================= */
/* ÖLÇÜM SINIRI */
/* ================================================= */

const MAX_ANGLE =
  10;



/* ================================================= */
/* SENSOR DEĞERLERİ */
/* ================================================= */

let filteredAx = 0;

let filteredAy = 0;

let filteredAz = 0;

let firstSensorReading = true;



/* ================================================= */
/* HAM DEĞERLER */
/* ================================================= */

let pitchRaw = 0;

let rollRaw = 0;



/* ================================================= */
/* BALON DEĞERLERİ */
/* ================================================= */

let bubblePitch = 0;

let bubbleRoll = 0;



/* ================================================= */
/* ARAÇ GÖRSEL DEĞERLERİ */
/* ================================================= */

let visualPitch = 0;

let visualRoll = 0;



/* ================================================= */
/* AÇI SINIRLAMA */
/* ================================================= */

function clampAngle(value){

  return Math.max(

    -MAX_ANGLE,

    Math.min(
      MAX_ANGLE,
      value
    )

  );

}



/* ================================================= */
/* DERECE YAZISI */
/* ================================================= */

function formatDegree(value){

  const rounded =
    Math.round(value);


  if(
    rounded > 0
  ){

    return "+" +
      rounded +
      "°";

  }


  return rounded +
    "°";

}



/* ================================================= */
/* KART SEVİYESİ */
/* ================================================= */

function updateCardLevel(
  card,
  value
){

  card.classList.remove(

    "level-0",

    "level-1",

    "level-2",

    "level-3",

    "level-4",

    "level-5"

  );


  const absValue =
    Math.abs(value);


  if(
    absValue <= 0.5
  ){

    card.classList.add(
      "level-0"
    );

  }

  else if(
    absValue <= 1
  ){

    card.classList.add(
      "level-1"
    );

  }

  else if(
    absValue <= 2
  ){

    card.classList.add(
      "level-2"
    );

  }

  else if(
    absValue <= 3
  ){

    card.classList.add(
      "level-3"
    );

  }

  else if(
    absValue <= 5
  ){

    card.classList.add(
      "level-4"
    );

  }

  else{

    card.classList.add(
      "level-5"
    );

  }

}



/* ================================================= */
/* ANA GÜNCELLEME */
/* ================================================= */

function updateLevel(){


  /*
    ARTIK RESET YOK.

    Telefonun bulunduğu konum
    doğrudan yerçekimi referansıdır.
  */


  let displayPitch =
    clampAngle(
      pitchRaw
    );


  let displayRoll =
    clampAngle(
      rollRaw
    );



  /* ================================================= */
  /* SAYISAL DEĞERLER */
/* ================================================= */

  pitchValue.textContent =
    formatDegree(
      displayPitch
    );


  rollValue.textContent =
    formatDegree(
      displayRoll
    );



  /* ================================================= */
  /* KART ÇERÇEVESİ */
/* ================================================= */

  updateCardLevel(
    pitchCard,
    displayPitch
  );


  updateCardLevel(
    rollCard,
    displayRoll
  );



  /* ================================================= */
  /* BALON FİLTRESİ */
/* ================================================= */

  bubblePitch +=

    (
      displayPitch -
      bubblePitch
    )

    *

    BUBBLE_ALPHA;


  bubbleRoll +=

    (
      displayRoll -
      bubbleRoll
    )

    *

    BUBBLE_ALPHA;



  /* ================================================= */
  /* DAİRESEL BALON */
/* ================================================= */

  /*
    ROLL  -> X ekseni
    PITCH -> Y ekseni

    ±10° = maksimum hareket
  */

  const maxMove =
    112;


  const moveX =

    (
      bubbleRoll /
      MAX_ANGLE
    )

    *

    maxMove;


  const moveY =

    (
      bubblePitch /
      MAX_ANGLE
    )

    *

    maxMove;


  bubble.style.transform =

    `translate(
      calc(-50% + ${moveX}px),
      calc(-50% + ${moveY}px)
    )`;



  /* ================================================= */
  /* ARAÇ GÖRSEL FİLTRESİ */
/* ================================================= */

  visualPitch +=

    (
      displayPitch -
      visualPitch
    )

    *

    VEHICLE_ALPHA;


  visualRoll +=

    (
      displayRoll -
      visualRoll
    )

    *

    VEHICLE_ALPHA;



  /* ================================================= */
  /* PITCH GÖRSELİ */
/* ================================================= */

  const pitchAngle =
    clampAngle(
      visualPitch
    );


  pitchImage.style.transform =
    `rotate(${pitchAngle}deg)`;



  /* ================================================= */
  /* ROLL GÖRSELİ */
/* ================================================= */

  const rollAngle =
    clampAngle(
      visualRoll
    );


  rollImage.style.transform =
    `rotate(${rollAngle}deg)`;

}



/* ================================================= */
/* SENSOR OKUMA */
/* ================================================= */

function handleMotion(event){

  if(
    !event.accelerationIncludingGravity
  ){

    return;

  }


  const a =
    event.accelerationIncludingGravity;


  const ax =
    a.x || 0;


  const ay =
    a.y || 0;


  const az =
    a.z || 0;



  /* ================================================= */
  /* SENSOR FİLTRESİ */
/* ================================================= */

  if(
    firstSensorReading
  ){

    filteredAx =
      ax;

    filteredAy =
      ay;

    filteredAz =
      az;

    firstSensorReading =
      false;

  }

  else{

    filteredAx +=

      (
        ax -
        filteredAx
      )

      *

      SENSOR_ALPHA;


    filteredAy +=

      (
        ay -
        filteredAy
      )

      *

      SENSOR_ALPHA;


    filteredAz +=

      (
        az -
        filteredAz
      )

      *

      SENSOR_ALPHA;

  }



  /* ================================================= */
  /* PITCH */
/* ================================================= */

  pitchRaw =

    Math.atan2(

      filteredAz,

      Math.sqrt(

        filteredAx *
        filteredAx +

        filteredAy *
        filteredAy

      )

    )

    *

    180 /

    Math.PI;



  /* ================================================= */
  /* ROLL */
/* ================================================= */

  rollRaw =

    Math.atan2(

      filteredAx,

      Math.sqrt(

        filteredAy *
        filteredAy +

        filteredAz *
        filteredAz

      )

    )

    *

    180 /

    Math.PI;



  updateLevel();

}



/* ================================================= */
/* SENSOR BAŞLAT */
/* ================================================= */

async function startSensor(){

  try{


    if(

      typeof DeviceMotionEvent !==
      "undefined"

      &&

      typeof DeviceMotionEvent.requestPermission ===
      "function"

    ){

      const permission =

        await

        DeviceMotionEvent
        .requestPermission();


      if(
        permission !==
        "granted"
      ){

        alert(
          "Hareket sensörü izni verilmedi."
        );

        return;

      }

    }



    window.addEventListener(

      "devicemotion",

      handleMotion,

      true

    );



    const startScreen =
      document.getElementById(
        "startScreen"
      );


    if(
      startScreen
    ){

      startScreen.remove();

    }

  }

  catch(error){

    console.error(
      error
    );


    alert(
      "Sensör başlatılamadı."
    );

  }

}
