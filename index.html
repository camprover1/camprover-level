<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Camprover Level</title>

<style>

:root{
  --bg:#080b0f;
  --panel:#11161c;
  --panel2:#151b22;
  --border:#27313a;
  --text:#f2f5f7;
  --muted:#7e8993;

  /* MAVİ TONUNU BURADAN DEĞİŞTİREBİLİRSİN */
  --level-blue:#00A8FF;

  --green:#20e890;
  --red:#ff4d5e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:min(1400px,100vw);
  height:100vh;
  min-height:0;
  padding:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ------------------------------------------------ */
/* HEADER */
/* ------------------------------------------------ */

.header{
  flex-shrink:0;
  text-align:center;
  margin-bottom:15px;
}

.header h1{
  margin:0;
  font-size:25px;
  font-weight:700;
  letter-spacing:4px;
}

.header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:11px;
  letter-spacing:2px;
}

/* ------------------------------------------------ */
/* DASHBOARD */
/* ------------------------------------------------ */

.dashboard{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(230px,1fr)
    minmax(420px,1.5fr)
    minmax(230px,1fr);

  gap:20px;
  align-items:stretch;
}

/* ------------------------------------------------ */
/* CARDS */
/* ------------------------------------------------ */

.card{
  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.005)
    ),
    var(--panel);

  border:4px solid var(--border);
  border-radius:22px;

  padding:20px;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  transition:
    border-color .35s ease,
    box-shadow .35s ease;
}

.card-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  text-align:center;
}

.value{
  text-align:center;
  font-size:46px;
  font-weight:700;
  line-height:1;
  margin-top:16px;

  font-variant-numeric:tabular-nums;
}

/* ------------------------------------------------ */
/* LEVEL BORDER */
/* ------------------------------------------------ */

.card.level-0{
  border-color:var(--level-blue);

  box-shadow:
    0 0 5px var(--level-blue),
    0 0 15px rgba(0,168,255,.45),
    inset 0 0 15px rgba(0,168,255,.08);
}

.card.level-1{
  border-color:rgba(0,168,255,.78);

  box-shadow:
    0 0 8px rgba(0,168,255,.35);
}

.card.level-2{
  border-color:rgba(0,168,255,.58);
}

.card.level-3{
  border-color:rgba(0,168,255,.40);
}

.card.level-4{
  border-color:rgba(0,168,255,.22);
}

.card.level-5{
  border-color:var(--border);
  box-shadow:none;
}

/* ------------------------------------------------ */
/* VEHICLE IMAGE */
/* ------------------------------------------------ */

.vehicle-area{
  flex:1;
  min-height:0;

  margin-top:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.vehicle-area img{
  width:92%;
  max-width:380px;
  height:auto;

  object-fit:contain;

  transition:
    transform .25s ease;
}

/* ------------------------------------------------ */
/* CENTER PANEL */
/* ------------------------------------------------ */

.center-panel{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:0;
}

.level{
  position:relative;

  width:min(440px,80vw);
  height:min(440px,80vw);

  max-width:100%;
  max-height:100%;

  border-radius:50%;

  background:
    radial-gradient(
      circle at center,
      #151d24 0%,
      #0e141a 65%,
      #090d11 100%
    );

  border:2px solid #26313a;

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.8),
    0 15px 35px rgba(0,0,0,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

/* ------------------------------------------------ */
/* CENTER CROSSHAIR */
/* ------------------------------------------------ */

.level::before{
  content:"";

  position:absolute;

  left:8%;
  right:8%;
  top:50%;

  height:1px;

  background:rgba(255,255,255,.10);

  transform:translateY(-50%);
}

.level::after{
  content:"";

  position:absolute;

  top:8%;
  bottom:8%;
  left:50%;

  width:1px;

  background:rgba(255,255,255,.10);

  transform:translateX(-50%);
}

/* ------------------------------------------------ */
/* BUBBLE */
/* ------------------------------------------------ */

.bubble{
  position:absolute;

  width:36px;
  height:36px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.95),
      rgba(30,232,144,.8) 25%,
      rgba(20,180,110,.75) 65%,
      rgba(0,0,0,.25) 100%
    );

  box-shadow:
    0 0 12px rgba(32,232,144,.75),
    inset 0 0 8px rgba(255,255,255,.35);

  transform:
    translate(
      var(--bubble-x,0px),
      var(--bubble-y,0px)
    );

  transition:
    transform .18s ease;
}

/* ------------------------------------------------ */
/* CENTER CAR */
/* ------------------------------------------------ */

.center-car{
  position:absolute;

  width:52%;

  height:auto;

  object-fit:contain;

  pointer-events:none;

  z-index:4;

  opacity:.95;

  transition:
    transform .18s ease;
}

/* ------------------------------------------------ */
/* RESET BUTTON */
/* ------------------------------------------------ */

.zero-button{
  position:absolute;

  left:
    calc(
      50%
      - min(440px,80vw)/2
      - 38px
    );

  top:50%;

  transform:translateY(-50%);

  width:32px;
  height:32px;

  padding:0;

  border-radius:50%;

  border:2px solid #27313a;

  background:#111820;

  color:#8d99a3;

  font-size:19px;
  line-height:28px;

  cursor:pointer;
  outline:none;

  z-index:30;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    color .25s ease,
    background .25s ease,
    transform .15s ease;
}

.zero-button:active{
  transform:
    translateY(-50%)
    scale(.90);
}

.zero-button.active{
  border-color:var(--level-blue);

  color:#ffffff;

  background:#0c1720;

  box-shadow:
    0 0 5px var(--level-blue),
    0 0 12px rgba(0,168,255,.55),
    0 0 20px rgba(0,168,255,.22);
}

/* ------------------------------------------------ */
/* FOOTER */
/* ------------------------------------------------ */

.footer{
  flex-shrink:0;

  text-align:center;

  margin-top:10px;

  color:#53606b;

  font-size:9px;

  letter-spacing:1px;
}

/* ================================================= */
/* MOBILE */
/* ================================================= */

@media(max-width:900px){

  /*
     MOBİLDE DE ÜÇ BÖLÜM YAN YANA:
     PITCH | TERAZİ | ROLL
  */

  body{
    align-items:center;
    overflow:hidden;
  }

  .app{
    width:100vw;
    height:100vh;

    min-height:0;

    padding:10px;

    overflow:hidden;
  }

  .header{
    margin-bottom:8px;
    flex-shrink:0;
  }

  .header h1{
    font-size:18px;
    letter-spacing:2px;
  }

  .header p{
    margin-top:3px;
    font-size:9px;
  }

  .dashboard{
    flex:1;

    min-height:0;

    grid-template-columns:
      minmax(0,1fr)
      minmax(0,1.25fr)
      minmax(0,1fr);

    gap:8px;

    align-items:stretch;
  }

  .card{
    min-height:0;

    height:100%;

    border-radius:16px;

    padding:10px;

    overflow:hidden;
  }

  .center-panel{
    min-height:0;

    height:100%;

    overflow:visible;
  }

  .card-title{
    font-size:10px;
    letter-spacing:2px;
  }

  .value{
    font-size:32px;
    margin-top:10px;
  }

  .vehicle-area{
    min-height:0;

    margin-top:8px;
  }

  .vehicle-area img{
    width:94%;
    max-width:none;
  }

  .center-panel .level{
    width:min(100%,42vh);
    height:min(100%,42vh);
  }

  .center-car{
    width:52%;
  }

  .zero-button{
    left:-38px;

    width:30px;
    height:30px;

    font-size:18px;
  }

  .footer{
    margin-top:6px;
    font-size:8px;

    flex-shrink:0;
  }
}

/* ================================================= */
/* SMALL MOBILE */
/* ================================================= */

@media(max-width:430px){

  .app{
    padding:7px;
  }

  .header{
    margin-bottom:5px;
  }

  .header h1{
    font-size:15px;
  }

  .header p{
    font-size:8px;
  }

  .dashboard{
    gap:5px;
  }

  .card{
    border-radius:12px;

    padding:7px;

    border-width:3px;
  }

  .card-title{
    font-size:8px;
    letter-spacing:1.5px;
  }

  .value{
    font-size:25px;
    margin-top:7px;
  }

  .vehicle-area{
    margin-top:4px;
  }

  .center-panel .level{
    width:min(100%,38vh);
    height:min(100%,38vh);
  }

  .zero-button{
    left:-34px;

    width:26px;
    height:26px;

    font-size:16px;
  }

  .footer{
    font-size:7px;
  }
}

</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>CAMPROVER LEVEL</h1>
    <p>LAND ROVER DISCOVERY 2 • EĞİM ÖLÇER</p>
  </div>

  <div class="dashboard">

    <!-- PITCH -->

    <div id="pitchCard" class="card level-5">

      <div class="card-title">
        PITCH
      </div>

      <div id="pitchValue" class="value">
        +0°
      </div>

      <div class="vehicle-area">

        <img
          id="pitchImage"
          alt="Discovery 2 Pitch"
        >

      </div>

    </div>


    <!-- CENTER -->

    <div class="center-panel">

      <div id="level" class="level">

        <div
          id="bubble"
          class="bubble">
        </div>

        <img
          id="centerCar"
          class="center-car"
          alt="Discovery 2"
        >

      </div>


      <button
        id="zeroButton"
        class="zero-button"
        aria-label="Ölçümü sıfırla"
        title="Ölçümü sıfırla"
      >↻</button>

    </div>


    <!-- ROLL -->

    <div id="rollCard" class="card level-5">

      <div class="card-title">
        ROLL
      </div>

      <div id="rollValue" class="value">
        +0°
      </div>

      <div class="vehicle-area">

        <img
          id="rollImage"
          alt="Discovery 2 Roll"
        >

      </div>

    </div>

  </div>


  <div class="footer">
    CAMPROVER • SENSOR BASED VEHICLE LEVEL
  </div>

</div>


<script>

/* ================================================= */
/* CACHE / SERVICE WORKER TEMİZLİĞİ */
/* ================================================= */

(async function(){

  try{

    if("serviceWorker" in navigator){

      const registrations =
        await navigator.serviceWorker.getRegistrations();

      for(const registration of registrations){
        await registration.unregister();
      }

    }

    if("caches" in window){

      const keys = await caches.keys();

      for(const key of keys){
        await caches.delete(key);
      }

    }

  }catch(e){

    console.log("Cache temizleme:",e);

  }

})();


/* ================================================= */
/* IMAGE VERSION */
/* ================================================= */

const IMAGE_VERSION = "20261008-06";


const pitchImage =
  document.getElementById("pitchImage");

const rollImage =
  document.getElementById("rollImage");

const centerCar =
  document.getElementById("centerCar");


pitchImage.src =
  "pitch_discovery.png?v=" +
  IMAGE_VERSION;

rollImage.src =
  "roll_discovery.png?v=" +
  IMAGE_VERSION;

centerCar.src =
  "roll_discovery.png?v=" +
  IMAGE_VERSION;


/* ================================================= */
/* ELEMENTLER */
/* ================================================= */

const pitchValue =
  document.getElementById("pitchValue");

const rollValue =
  document.getElementById("rollValue");

const pitchCard =
  document.getElementById("pitchCard");

const rollCard =
  document.getElementById("rollCard");

const bubble =
  document.getElementById("bubble");

const zeroButton =
  document.getElementById("zeroButton");


/* ================================================= */
/* SENSOR FILTER */
/* ================================================= */

const SENSOR_ALPHA = 0.15;
const BUBBLE_ALPHA = 0.15;


/* ================================================= */
/* SENSOR DEĞİŞKENLERİ */
/* ================================================= */

let filteredAx = 0;
let filteredAy = 0;
let filteredAz = 0;

let firstSensorReading = true;


/* ================================================= */
/* BUBBLE DEĞERLERİ */
/* ================================================= */

let bubblePitch = 0;
let bubbleRoll = 0;


/* ================================================= */
/* RESET / ZERO */
/* ================================================= */

let zeroActive = false;

let zeroPitch = 0;
let zeroRoll = 0;

let pitchRaw = 0;
let rollRaw = 0;


/* ================================================= */
/* LEVEL COLOR */
/* ================================================= */

function updateCardLevel(card,value){

  card.classList.remove(
    "level-0",
    "level-1",
    "level-2",
    "level-3",
    "level-4",
    "level-5"
  );

  const absValue =
    Math.abs(value);

  if(absValue <= 0.5){

    card.classList.add("level-0");

  }else if(absValue <= 1){

    card.classList.add("level-1");

  }else if(absValue <= 2){

    card.classList.add("level-2");

  }else if(absValue <= 3){

    card.classList.add("level-3");

  }else if(absValue <= 5){

    card.classList.add("level-4");

  }else{

    card.classList.add("level-5");

  }

}


/* ================================================= */
/* DISPLAY */
/* ================================================= */

function formatDegree(value){

  const rounded =
    Math.round(value);

  if(rounded > 0)
    return "+" + rounded + "°";

  return rounded + "°";
}


/* ================================================= */
/* LEVEL UPDATE */
/* ================================================= */

function updateLevel(){

  let displayPitch =
    pitchRaw;

  let displayRoll =
    rollRaw;


  if(zeroActive){

    displayPitch =
      pitchRaw - zeroPitch;

    displayRoll =
      rollRaw - zeroRoll;

  }


  /* DISPLAY */

  pitchValue.textContent =
    formatDegree(displayPitch);

  rollValue.textContent =
    formatDegree(displayRoll);


  /* CARD BORDER */

  updateCardLevel(
    pitchCard,
    displayPitch
  );

  updateCardLevel(
    rollCard,
    displayRoll
  );


  /* ================================================= */
  /* BUBBLE FILTER */
  /* ================================================= */

  bubblePitch +=
    (displayPitch - bubblePitch)
    * BUBBLE_ALPHA;

  bubbleRoll +=
    (displayRoll - bubbleRoll)
    * BUBBLE_ALPHA;


  /* ================================================= */
  /* BUBBLE MOVEMENT */
  /* ================================================= */

  const maxMove = 115;

  const bubbleX =
    Math.max(
      -maxMove,
      Math.min(
        maxMove,
        bubbleRoll * 7
      )
    );

  const bubbleY =
    Math.max(
      -maxMove,
      Math.min(
        maxMove,
        bubblePitch * 7
      )
    );


  bubble.style.setProperty(
    "--bubble-x",
    bubbleX + "px"
  );

  bubble.style.setProperty(
    "--bubble-y",
    bubbleY + "px"
  );


  /* ================================================= */
  /* PITCH VEHICLE MOVEMENT */
  /* ================================================= */

  const pitchMove =
    Math.max(
      -100,
      Math.min(
        100,
        displayPitch * 5
      )
    );


  pitchImage.style.transform =
    `translateY(${pitchMove * 1.2}px)`;


  /* ================================================= */
  /* ROLL VEHICLE MOVEMENT */
  /* ================================================= */

  const rollMove =
    Math.max(
      -100,
      Math.min(
        100,
        displayRoll * 5
      )
    );


  rollImage.style.transform =
    `rotate(${rollMove}deg)`;

}


/* ================================================= */
/* SENSOR */
/* ================================================= */

function handleMotion(event){

  if(!event.accelerationIncludingGravity)
    return;


  const a =
    event.accelerationIncludingGravity;


  const ax =
    a.x || 0;

  const ay =
    a.y || 0;

  const az =
    a.z || 0;


  /* ================================================= */
  /* SENSOR FILTER */
  /* ================================================= */

  if(firstSensorReading){

    filteredAx = ax;
    filteredAy = ay;
    filteredAz = az;

    firstSensorReading = false;

  }else{

    filteredAx +=
      (ax - filteredAx)
      * SENSOR_ALPHA;

    filteredAy +=
      (ay - filteredAy)
      * SENSOR_ALPHA;

    filteredAz +=
      (az - filteredAz)
      * SENSOR_ALPHA;

  }


  /* ================================================= */
  /* PITCH */
  /* ================================================= */

  pitchRaw =
    Math.atan2(
      filteredAz,
      Math.sqrt(
        filteredAx * filteredAx +
        filteredAy * filteredAy
      )
    )
    * 180 /
    Math.PI;


  /* ================================================= */
  /* ROLL */
  /* ================================================= */

  rollRaw =
    Math.atan2(
      filteredAx,
      Math.sqrt(
        filteredAy * filteredAy +
        filteredAz * filteredAz
      )
    )
    * 180 /
    Math.PI;


  updateLevel();

}


/* ================================================= */
/* SENSOR PERMISSION */
/* ================================================= */

async function startSensor(){

  try{

    if(
      typeof DeviceMotionEvent !==
      "undefined" &&
      typeof DeviceMotionEvent.requestPermission ===
      "function"
    ){

      const permission =
        await DeviceMotionEvent.requestPermission();

      if(permission !== "granted"){

        alert(
          "Hareket sensörü izni verilmedi."
        );

        return;

      }

    }


    window.addEventListener(
      "devicemotion",
      handleMotion,
      true
    );


    document
      .getElementById("startScreen")
      ?.remove();


  }catch(error){

    console.error(error);

    alert(
      "Sensör başlatılamadı."
    );

  }

}


/* ================================================= */
/* START SCREEN */
/* ================================================= */

const startScreen =
document.createElement("div");

startScreen.id =
"startScreen";

startScreen.style.cssText = `
position:fixed;
inset:0;
z-index:9999;
background:#080b0f;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:18px;
text-align:center;
`;

startScreen.innerHTML = `

<div style="
font-size:22px;
font-weight:700;
letter-spacing:3px;
">
CAMPROVER LEVEL
</div>

<div style="
font-size:11px;
letter-spacing:2px;
color:#7e8993;
">
HAREKET SENSÖRÜNÜ BAŞLAT
</div>

<button id="startButton"
style="
padding:14px 24px;
border-radius:30px;
border:2px solid var(--level-blue);
background:#0d151c;
color:#fff;
font-size:14px;
font-weight:700;
letter-spacing:1px;
cursor:pointer;
box-shadow:
0 0 12px rgba(0,168,255,.35);
">
ÖLÇÜMÜ BAŞLAT
</button>

`;

document.body.appendChild(
  startScreen
);


document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startSensor
  );


/* ================================================= */
/* RESET BUTTON */
/* ================================================= */

zeroButton.addEventListener(
  "click",
  function(){

    if(!zeroActive){

      /*
         İlk basış:
         Mevcut konumu 0° kabul et.
      */

      zeroPitch =
        pitchRaw;

      zeroRoll =
        rollRaw;

      zeroActive =
        true;


      bubblePitch =
        0;

      bubbleRoll =
        0;


      zeroButton
        .classList
        .add("active");


      zeroButton
        .setAttribute(
          "aria-label",
          "Sıfırlamayı iptal et"
        );


      zeroButton.title =
        "Yerçekimi referansına dön";


      updateLevel();


    }else{

      /*
         İkinci basış:
         Dünya / yerçekimi referansına dön.
      */

      zeroActive =
        false;

      zeroPitch =
        0;

      zeroRoll =
        0;


      bubblePitch =
        0;

      bubbleRoll =
        0;


      zeroButton
        .classList
        .remove("active");


      zeroButton
        .setAttribute(
          "aria-label",
          "Ölçümü sıfırla"
        );


      zeroButton.title =
        "Ölçümü sıfırla";


      updateLevel();

    }

  }
);

</script>

</body>
</html>
