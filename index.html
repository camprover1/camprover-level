/* =========================================================
RENKLER
========================================================= */

:root{

/* =========================================================
GENEL

*{

/* =========================================================
CAMPROVER
========================================================= */

.brand{

position:absolute;

top:7px;

left:50%;

.gpsInfo{

justify-content:space-around;

align-items:center;

0 0 14px

}


.gpsItem{

display:flex;

flex-direction:column;

align-items:center;

min-width:120px;

}


.gpsLabel{

font-size:12px;

font-weight:600;

letter-spacing:1.5px;

color:#8e9aa3;

}


.gpsValue{

font-size:26px;

font-weight:700;

line-height:1.1;

letter-spacing:.5px;

color:#f5f8fa;

}


/* =========================================================
ANA DASHBOARD
========================================================= */

.dashboard{

width:100%;

height:100vh;

min-height:600px;

display:grid;

1fr 1.05fr 1fr;

gap:18px;

align-items:center;

padding:
85px
25px
25px;

PANELLER
========================================================= */

.panel{

position:relative;

height:
calc(100vh - 110px);

min-height:430px;

background:
linear-gradient(
145deg,
rgba(17,24,31,.96),
rgba(8,12,16,.96)

var(--panel-border);

border-color .25s ease,
box-shadow .25s ease;

========================================================= */

.unit{

========================================================= */

25px
25px;

  margin:0 auto;
  border-radius:50%;
  overflow:hidden;
  isolation:isolate;
  background:#111820;
  border:4px solid #27343d;
  box-shadow:inset 0 0 20px rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.35);
}
.compassMapRotator,
#satelliteMap{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
}
.compassMapRotator{transform:rotate(0deg);transform-origin:50% 50%;transition:transform .35s ease-out;}
#satelliteMap{background:#172128;}
#satelliteMap .leaflet-control-container{display:none;}
.compassRing{
  position:absolute;
  inset:0;
  z-index:500;
  pointer-events:none;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.32);
  transform:rotate(0deg);
  transform-origin:50% 50%;
  transition:transform .35s ease-out;
}
.compassRing .compassCardinal{
  position:absolute;
  color:#fff;
  font-size:12px;
  font-weight:800;
  text-shadow:0 1px 4px #000,0 0 5px #000;
  transform:translate(-50%,-50%);
}
.compassN{left:50%;top:7%;}
.compassNE{left:80%;top:20%;}
.compassE{left:93%;top:50%;}
.compassSE{left:80%;top:80%;}
.compassS{left:50%;top:93%;}
.compassSW{left:20%;top:80%;}
.compassW{left:7%;top:50%;}
.compassNW{left:20%;top:20%;}
.compassCenterArrow{
  position:absolute;
  z-index:510;
  left:50%;
  top:50%;
  width:0;
  height:0;
  transform:translate(-50%,-100%);
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:25px solid #35e27a;
  filter:drop-shadow(0 1px 3px #000);
  pointer-events:none;
}
.mapMessage{
  position:absolute;
  z-index:520;
  left:50%;
  bottom:15%;
  transform:translateX(-50%);
  max-width:78%;
  padding:5px 9px;
  border-radius:7px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:10px;
  text-align:center;
  pointer-events:none;
}
.currentLocationButton{
  position:absolute;
  z-index:600;
  right:12px;
  bottom:12px;
  width:38px;
  height:38px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(0,168,255,.85);
  border-radius:8px;
  background:rgba(5,15,22,.95);
  color:#fff;
  font-size:21px;
  line-height:1;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.currentLocationButton:active{transform:scale(.94);}
.currentLocationButton:focus,
.currentLocationButton:focus-visible{outline:none;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.compassMapRotator{transform-origin:center center;transition:transform .35s ease-out;}

/* Konum düğmesi harita dairesinin değil, büyük harita kutusunun sağ altındadır. */
.directionSection{position:relative;padding-bottom:68px;min-height:0;}

</div></div></section><section class="directionSection" aria-label="Uydu haritası ve yön pusulası"><div class="directionHeader"><div class="directionTitle">YÖN / UYDU HARİTASI</div><div class="gpsStatus" id="gpsStatus">GPS BEKLENİYOR</div></div><div class="compassMapFrame" id="compassMapFrame"><div class="compassMapRotator" id="compassMapRotator"><div id="satelliteMap" aria-label="Uydu haritası"></div></div><div class="compassRing" aria-hidden="true"><span class="compassCardinal compassN">N</span><span class="compassCardinal compassNE">NE</span><span class="compassCardinal compassE">E</span><span class="compassCardinal compassSE">SE</span><span class="compassCardinal compassS">S</span><span class="compassCardinal compassSW">SW</span><span class="compassCardinal compassW">W</span><span class="compassCardinal compassNW">NW</span></div><div class="compassCenterArrow" aria-hidden="true"></div><div class="mapMessage" id="mapMessage">GPS konumu bekleniyor</div></div><button id="currentLocationButton" class="currentLocationButton" type="button" aria-label="Mevcut konumu göster" title="Mevcut konumu göster"><svg class="locationIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1.8v4M12 18.2v4M1.8 12h4M18.2 12h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>

(async function(){


/* =======================================================
SERVICE WORKER TEMİZLE
======================================================== */

try{

if(
"serviceWorker" in navigator
){

const registrations =
await navigator
.serviceWorker
.getRegistrations();


for(
const registration
of registrations
){

await registration.unregister();

}

}

}catch(error){

console.log(
"Service Worker temizleme:",
error
);

}


/* =======================================================
CACHE TEMİZLE
======================================================== */

try{

if(
"caches" in window
){

const keys =
await caches.keys();


for(
const key
of keys
){

await caches.delete(key);

}

}

}catch(error){

console.log(
"Cache temizleme:",
error
);

}


/* =======================================================
GÖRSELLER
======================================================== */

const IMAGE_VERSION =
"20261009-20";


const pitchImage =
document.getElementById(
"pitchImage"
);


const rollImage =
document.getElementById(
"rollImage"
);


pitchImage.src =
"pitch_discovery.png?v=" +
IMAGE_VERSION;


rollImage.src =
"roll_discovery.png?v=" +
IMAGE_VERSION;


/* =======================================================
DOM
======================================================== */

const pitchValue =
document.getElementById(
"pitchValue"
);


const rollValue =
document.getElementById(
"rollValue"
);


const pitchPanel =
document.getElementById(
"pitchPanel"
);


const rollPanel =
document.getElementById(
"rollPanel"
);


const bubble =
document.getElementById(
"bubble"
);


const altitudeValue =
document.getElementById(
"altitudeValue"
);


const speedValue =
document.getElementById(
"speedValue"
);


const startScreen =
document.getElementById(
"startScreen"
);


const startButton =
document.getElementById(
"startButton"
);


/* =======================================================
FİLTRELER
======================================================== */

const SENSOR_ALPHA =
0.08;


const BUBBLE_ALPHA =
0.08;


const VEHICLE_ALPHA =
0.20;


const DEAD_BAND =
0.15;


const MAX_ANGLE =
10;


const ALTITUDE_ALPHA =
0.08;


const SPEED_ALPHA =
0.35;


/* =======================================================
SENSOR
======================================================== */

let filteredAx = 0;

let filteredAy = 0;

let filteredAz = 0;

let sensorInitialized =
false;


let pitchFiltered = 0;

let rollFiltered = 0;


let bubblePitch = 0;

let bubbleRoll = 0;


let vehiclePitch = 0;

let vehicleRoll = 0;


/* =======================================================
GPS
======================================================== */

let altitudeFiltered =
null;


let speedFiltered =
0;


let gpsStarted =
false;

/* =======================================================
HARİTA / PUSULA
======================================================== */

let satelliteMap = null;
let mapMarker = null;
let currentHeading = null;
let mapHasCentered = false;
let lastKnownCoords = null;

const gpsStatus = document.getElementById("gpsStatus");
const mapMessage = document.getElementById("mapMessage");
const compassMapRotator = document.getElementById("compassMapRotator");
const compassRing = document.querySelector(".compassRing");
const currentLocationButton = document.getElementById("currentLocationButton");

function normalizeHeading(value){
return ((value % 360) + 360) % 360;
}

let smoothedHeading = null;
const HEADING_SMOOTHING = 0.12; // Düşük değer = daha sakin dönüş
const HEADING_DEADBAND = 2.0;   // 2 dereceden küçük oynamaları yok say

function smoothAngle(current, target){
  if(current === null || !Number.isFinite(current)) return target;
  let difference = ((target - current + 540) % 360) - 180;
  if(Math.abs(difference) < HEADING_DEADBAND) return current;
  return (current + difference * HEADING_SMOOTHING + 360) % 360;
}

function updateHeadingDisplay(){
/* Pusula yönünü yumuşatılmış açıyla uygula.
   Harita ve yön harfleri birlikte döner. */
if(compassMapRotator && smoothedHeading !== null){
  compassMapRotator.style.transform = "rotate(" + (-smoothedHeading) + "deg)";
}
if(compassRing && smoothedHeading !== null){
  /* Harflerin de haritayla birlikte dönmesini sağla. */
  compassRing.style.transform = "rotate(" + (-smoothedHeading) + "deg)";
}
}

function handleOrientation(event){
let heading = null;

/* iOS Safari'nin sağladığı manyetik pusula açısı */
if(Number.isFinite(event.webkitCompassHeading)){
heading = event.webkitCompassHeading;
}else if(Number.isFinite(event.alpha)){
/* Standart alpha yedeği; cihaz yönüne göre değişebilir. */
heading = 360 - event.alpha;
}

if(heading === null || !Number.isFinite(heading)) return;

currentHeading = normalizeHeading(heading);
  smoothedHeading = smoothAngle(smoothedHeading, currentHeading);
updateHeadingDisplay();
}

function initSatelliteMap(){
if(satelliteMap || typeof L === "undefined") return;

satelliteMap = L.map("satelliteMap", {
zoomControl:false,
attributionControl:false,
dragging:false,
scrollWheelZoom:false,
doubleClickZoom:false,
boxZoom:false,
keyboard:false,
tap:false,
zoomAnimation:false,
fadeAnimation:false,
markerZoomAnimation:false
}).setView([39, 35], 5);

/* Esri World Imagery: gerçek uydu/fotoğraf katmanı. */
L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
{maxZoom:19}
).addTo(satelliteMap);

mapMarker = L.circleMarker([39,35], {
radius:4,
color:"#ffffff",
weight:2,
fillColor:"#ff3038",
fillOpacity:1
}).addTo(satelliteMap);

mapMessage.textContent = "GPS konumu bekleniyor";
}

function updateSatelliteMap(coords){
if(!coords || !Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)){
return;
}

initSatelliteMap();
if(!satelliteMap) return;

const latlng = [coords.latitude, coords.longitude];
lastKnownCoords = {latitude:coords.latitude, longitude:coords.longitude};

if(!mapHasCentered){
satelliteMap.setView(latlng, 17, {animate:false});
mapHasCentered = true;
}else{
satelliteMap.panTo(latlng, {animate:false});
}

if(mapMarker) mapMarker.setLatLng(latlng);

const accuracy = Number.isFinite(coords.accuracy)
? Math.round(coords.accuracy)
: null;

/* Tarayıcı GPS uydu adedini sunmaz; bunun yerine GPS doğruluğu gösterilir. */
gpsStatus.textContent = accuracy !== null
? `GPS ±${accuracy} m`
: "GPS AKTİF";

mapMessage.textContent = "UYDU GÖRÜNTÜSÜ";
}


/* =======================================================
RAKIM GEÇMİŞİ
======================================================== */

currentLocationButton.addEventListener("click", function(){
/* Buton yalnızca tıklama anında çalışır; basılı/aktif kalmaz. */
this.blur();

if(!lastKnownCoords){
mapMessage.textContent = "GPS konumu henüz alınmadı";
return;
}
initSatelliteMap();
if(satelliteMap){
satelliteMap.setView([lastKnownCoords.latitude, lastKnownCoords.longitude], 17, {animate:true});
mapHasCentered = true;
mapMessage.textContent = "MEVCUT KONUM";
}
});

let altitudeHistory = [];


/*
* Varsayılan:
* Son 500 metre
*/

let historyRange =
500;


let lastGPSPosition =
null;


let totalDistance =
0;


/* =======================================================
YARDIMCI
======================================================== */

function clamp(
value,
min,
max
){

return Math.max(
min,
Math.min(
max,
value
)
);

}


function stabilize(
value
){

if(
Math.abs(value) <
DEAD_BAND
){

return 0;

}


return value;

}


function formatAngle(
value
){

let rounded =
Math.round(value);


rounded =
clamp(
rounded,
-MAX_ANGLE,
MAX_ANGLE
);


if(
rounded === 0
){

return "+0";

}


return rounded > 0
? "+" + rounded
: String(rounded);

}


/* =======================================================
MAVİ ÇERÇEVE
======================================================== */

function updateBorder(
panel,
value
){

const abs =
Math.abs(value);


let strength = 0;


if(
abs <= 5
){

strength =
(5 - abs) / 5;

}


if(
strength <= 0
){

panel.style.borderColor =
"var(--panel-border)";


panel.style.boxShadow =
"none";


return;

}


const alpha =
0.18 +
strength * 0.82;


panel.style.borderColor =
`rgba(0,168,255,${alpha})`;


panel.style.boxShadow =
`0 0 ${8 + strength * 20}px rgba(0,168,255,${strength * .28})`;

}


/* =======================================================
SEVİYE GÜNCELLE
======================================================== */

function updateLevel(){


pitchFiltered =
clamp(
stabilize(
pitchFiltered
),
-MAX_ANGLE,
MAX_ANGLE
);


rollFiltered =
clamp(
stabilize(
rollFiltered
),
-MAX_ANGLE,
MAX_ANGLE
);


/* DERECE */

pitchValue.innerHTML =
formatAngle(
pitchFiltered
) +
'<span class="unit">°</span>';


rollValue.innerHTML =
formatAngle(
rollFiltered
) +
'<span class="unit">°</span>';


/* MAVİ ÇERÇEVE */

updateBorder(
pitchPanel,
pitchFiltered
);


updateBorder(
rollPanel,
rollFiltered
);


/* =====================================================
BALON
====================================================== */

bubblePitch +=
(
pitchFiltered -
bubblePitch
) *
BUBBLE_ALPHA;


bubbleRoll +=
(
rollFiltered -
bubbleRoll
) *
BUBBLE_ALPHA;


const level =
bubble.parentElement;


const maxX =
level.clientWidth *
0.38;


const maxY =
level.clientHeight *
0.38;


const x =
(
bubbleRoll /
MAX_ANGLE
) *
maxX;


const y =
(
bubblePitch /
MAX_ANGLE
) *
maxY;


bubble.style.transform =
`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;


/* =====================================================
ARAÇ GÖRSELLERİ
====================================================== */

vehiclePitch +=
(
pitchFiltered -
vehiclePitch
) *
VEHICLE_ALPHA;


vehicleRoll +=
(
rollFiltered -
vehicleRoll
) *
VEHICLE_ALPHA;


vehiclePitch =
clamp(
vehiclePitch,
-MAX_ANGLE,
MAX_ANGLE
);


vehicleRoll =
clamp(
vehicleRoll,
-MAX_ANGLE,
MAX_ANGLE
);


pitchImage.style.transform =
`rotate(${vehiclePitch}deg)`;


rollImage.style.transform =
`rotate(${vehicleRoll}deg)`;

}


/* =======================================================
HAREKET SENSÖRÜ
======================================================== */

function handleMotion(
event
){

const acceleration =
event.accelerationIncludingGravity;


if(!acceleration){

return;

}


let ax =
acceleration.x || 0;


let ay =
acceleration.y || 0;


let az =
acceleration.z || 0;


/* İlk sensör okuması */

if(
!sensorInitialized
){

filteredAx = ax;

filteredAy = ay;

filteredAz = az;

sensorInitialized =
true;

}else{

filteredAx +=
(
ax -
filteredAx
) *
SENSOR_ALPHA;


filteredAy +=
(
ay -
filteredAy
) *
SENSOR_ALPHA;


filteredAz +=
(
az -
filteredAz
) *
SENSOR_ALPHA;

}


/* =====================================================
PITCH
====================================================== */

const newPitch =
Math.atan2(
filteredAz,
Math.sqrt(
filteredAx *
filteredAx +
filteredAy *
filteredAy
)
) *
180 /
Math.PI;


/* =====================================================
ROLL
====================================================== */

const newRoll =
Math.atan2(
filteredAx,
Math.sqrt(
filteredAy *
filteredAy +
filteredAz *
filteredAz
)
) *
180 /
Math.PI;


/* =====================================================
FİLTRE
====================================================== */

pitchFiltered +=
(
newPitch -
pitchFiltered
) *
SENSOR_ALPHA;


rollFiltered +=
(
newRoll -
rollFiltered
) *
SENSOR_ALPHA;


updateLevel();

}


/* =======================================================
GPS MESAFE HESABI
======================================================== */

function calculateDistance(
lat1,
lon1,
lat2,
lon2
){

const R =
6371000;


const dLat =
(
lat2 -
lat1
) *
Math.PI /
180;


const dLon =
(
lon2 -
lon1
) *
Math.PI /
180;


const a =
Math.sin(
dLat / 2
) ** 2 +

Math.cos(
lat1 *
Math.PI /
180
) *

Math.cos(
lat2 *
Math.PI /
180
) *

Math.sin(
dLon / 2
) ** 2;


return R *
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1 - a)
);

}


/* =======================================================
RAKIM GRAFİĞİ
======================================================== */

function drawAltitudeHistory(){


const path =
document.getElementById(
"altitudePath"
);


const fill =
document.getElementById(
"altitudeFill"
);


const noData =
document.getElementById(
"chartNoData"
);


const minElement =
document.getElementById(
"historyMin"
);


const maxElement =
document.getElementById(
"historyMax"
);


const diffElement =
document.getElementById(
"historyDiff"
);


if(
altitudeHistory.length < 2
){

path.setAttribute(
"d",
""
);


fill.setAttribute(
"d",
""
);


noData.style.display =
"flex";


return;

}


noData.style.display =
"none";


const values =
altitudeHistory.map(
point =>
point.altitude
);


const min =
Math.min(
...values
);


const max =
Math.max(
...values
);


const range =
Math.max(
10,
max - min
);


minElement.textContent =
Math.round(min) +
" m";


maxElement.textContent =
Math.round(max) +
" m";


const difference =
max - min;


diffElement.textContent =
"+" +
Math.round(
difference
) +
" m";


const width =
1000;


const height =
320;


const padding =
20;


const startDistance =
Math.max(
0,
totalDistance -
historyRange
);


const endDistance =
Math.max(
historyRange,
totalDistance
);


const distanceRange =
Math.max(
1,
endDistance -
startDistance
);


const points =
altitudeHistory.map(
point => {


const x =
padding +

(
(
point.distance -
startDistance
) /
distanceRange
) *

(
width -
padding * 2
);


const normalized =
(
point.altitude -
min
) /
range;


const y =
height -
padding -

normalized *
(
height -
padding * 2
);


return {
x,
y
};

}
);


let d = "";


points.forEach(
(
point,
index
) => {

d +=
index === 0
? `M ${point.x} ${point.y}`
: ` L ${point.x} ${point.y}`;

}
);


path.setAttribute(
"d",
d
);


const lastPoint =
points[
points.length - 1
];


const firstPoint =
points[0];


const fillD =
d +
` L ${lastPoint.x} ${height}` +
` L ${firstPoint.x} ${height} Z`;


fill.setAttribute(
"d",
fillD
);

}


/* =======================================================
GPS
======================================================== */

function startGPS(){


if(
gpsStarted
){

return;

}


gpsStarted =
true;


if(
!(
"geolocation"
in navigator
)
){

altitudeValue.textContent =
"-- m";


speedValue.textContent =
"-- km/h";


return;

}


navigator.geolocation.watchPosition(

function(position){

const coords =
position.coords;

updateSatelliteMap(coords);


/* =================================================
RAKIM
================================================== */

if(
coords.altitude !== null &&
Number.isFinite(
coords.altitude
)
){

const altitude =
coords.altitude;


if(
altitudeFiltered === null
){

altitudeFiltered =
altitude;

}else{

altitudeFiltered +=
(
altitude -
altitudeFiltered
) *
ALTITUDE_ALPHA;

}


altitudeValue.textContent =
Math.round(
altitudeFiltered
) +
" m";

}


/* =================================================
HIZ
================================================== */

if(
coords.speed !== null &&
Number.isFinite(
coords.speed
)
){

let speedKmh =
coords.speed *
3.6;


if(
speedKmh < 1
){

speedKmh =
0;

}


speedFiltered +=
(
speedKmh -
speedFiltered
) *
SPEED_ALPHA;


if(
speedFiltered < 1
){

speedFiltered =
0;

}


speedValue.textContent =
Math.round(
speedFiltered
) +
" km/h";

}


/* =================================================
RAKIM GEÇMİŞİ
================================================== */

if(
altitudeFiltered !== null &&
coords.latitude !== null &&
coords.longitude !== null
){

if(
lastGPSPosition
){

const distance =
calculateDistance(

lastGPSPosition.latitude,

lastGPSPosition.longitude,

coords.latitude,

coords.longitude

);


/*
* GPS'in küçük
* oynamalarını
* mesafe kabul etme.
*/

if(
distance >= 3
){

totalDistance +=
distance;


altitudeHistory.push({

distance:
totalDistance,

altitude:
altitudeFiltered

});

}

}else{

altitudeHistory.push({

distance:0,

altitude:
altitudeFiltered

});

}


lastGPSPosition = {

latitude:
coords.latitude,

longitude:
coords.longitude

};


/*
* Seçilen menzilden
* eski verileri çıkar.
*/

const minDistance =
Math.max(
0,
totalDistance -
historyRange
);


altitudeHistory =
altitudeHistory.filter(
point =>
point.distance >=
minDistance
);


drawAltitudeHistory();

}

},


function(error){

console.log(
"GPS hatası:",
error
);

},


{

enableHighAccuracy:true,

maximumAge:1000,

timeout:10000

}

);

}


/* =======================================================
RAKIM MENZİL BUTONLARI
======================================================== */

document
.querySelectorAll(
".historyButtons button"
)
.forEach(
button => {

button.addEventListener(
"click",
function(){

document
.querySelectorAll(
".historyButtons button"
)
.forEach(
b =>
b.classList.remove(
"active"
)
);


this.classList.add(
"active"
);


historyRange =
Number(
this.dataset.range
);


const minDistance =
Math.max(
0,
totalDistance -
historyRange
);


altitudeHistory =
altitudeHistory.filter(
point =>
point.distance >=
minDistance
);


drawAltitudeHistory();

}
);

}
);


/* =======================================================
SENSOR BAŞLAT
======================================================== */

async function startSensor(){


try{


/* iOS sensör izni */

if(

typeof DeviceMotionEvent !==
"undefined" &&

typeof
DeviceMotionEvent
.requestPermission ===
"function"

){

const permission =
await
DeviceMotionEvent
.requestPermission();


if(
permission !==
"granted"
){

alert(
"Hareket sensörü izni verilmedi."
);


return;

}

}


/* DeviceMotion */

window.addEventListener(
"devicemotion",
handleMotion,
true
);

/* Pusula yönü */
window.addEventListener(
"deviceorientation",
handleOrientation,
true
);

/* Harita yüklenemese bile ölçüm ekranı açılsın. */
try {
  initSatelliteMap();
} catch (mapError) {
  console.error("Uydu haritası başlatılamadı:", mapError);
  const mapMessageElement = document.getElementById("mapMessage");
  if (mapMessageElement) {
    mapMessageElement.textContent = "Harita yüklenemedi; GPS ölçümü devam ediyor";
  }
}


/* GPS */

startGPS();


/* Başlangıç ekranını kapat */

startScreen.style.display =
"none";


}catch(error){

console.error(
"Sensör başlatma hatası:",
error
);


alert(
"Sensör başlatılamadı."
);

}

}


/* =======================================================
BAŞLAT BUTONU
======================================================== */

startButton.addEventListener(
"click",
startSensor
);


/* =======================================================
İLK DURUM
======================================================== */

updateLevel();

drawAltitudeHistory();


})();

</script></body></html>
